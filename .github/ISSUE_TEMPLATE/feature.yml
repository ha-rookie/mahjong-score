name: Feature
description: 新機能・改善を設計して実装する
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ必要か。利用者の事実、問い合わせ、データを記載
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の問題
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Goal / 期待する動作
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象・非対象
      placeholder: |
        対象:
        非対象:
    validations:
      required: true
  - type: textarea
    id: branch_tracking
    attributes:
      label: Branch / PR Tracking
      description: Issueと実装状態を追跡可能にする。Branch名にはIssue番号を含める
      placeholder: |
        Branch: feat/issue-<number>-<summary>
        PR: 作成後に追記
    validations:
      required: true
  - type: textarea
    id: planned_files
    attributes:
      label: Planned Files
      description: 変更予定のfile / directory。未確定の場合は候補と未確定理由を記載
      placeholder: |
        - path/to/file
    validations:
      required: true
  - type: dropdown
    id: risk_level
    attributes:
      label: Risk Level
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: checkboxes
    id: impact_flags
    attributes:
      label: Impact Flags
      description: 該当する影響だけ選択する。未選択項目はNoとして扱う
      options:
        - label: Runtime
        - label: UI
        - label: Mobile / Sensor
        - label: Asset
        - label: Security / Secret / Infra
        - label: Public Repository
        - label: Design / Operation Meaning
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: lint、test、build、Preview、実機、Production等、完了判定に必要な確認
    validations:
      required: true
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop Conditions
      description: Scope拡張、Planned Files外変更、外部制約など、Human確認へ戻る条件
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: UI、データ、Security、SEO、Cloudflare、運用
  - type: textarea
    id: asset_handoff
    attributes:
      label: Asset Handoff
      description: Assetを使わない場合は「該当なし」。承認済みAssetを使う場合はDesign承認から実装へ固定情報を引き継ぐ
      placeholder: |
        Asset使用: あり / なし
        元Design Issue/PR:
        承認済みAsset一覧:
        Asset配置場所:
        人間によるbinary upload: 必要 / 不要
        人間作業が必要な場合の範囲:
        file hash または承認head SHA:
        承認Preview:
        補足:
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: テスト観点
    validations:
      required: true
  - type: checkboxes
    id: design
    attributes:
      label: 設計書
      options:
        - label: 設計書更新の要否を判断した
          required: true
        - label: Asset使用時は承認済みAssetの固定情報を確認した
          required: false
        - label: 人間承認前にmainへマージしない
          required: true
