name: D1 Long-term Performance Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/d1-performance-benchmark.yml"
      - "scripts/d1-performance-benchmark.mjs"
      - "package.json"
      - "migrations/**"
      - "src/worker.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahjong-score-d1-performance-preview
  cancel-in-progress: false

jobs:
  benchmark-preview-d1:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to protected Preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:preview

      - name: Run 5-year and 10-year benchmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:performance:preview

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/d1-performance-report.md ]]; then
            cat artifacts/d1-performance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 performance report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-performance-benchmark-${{ github.run_id }}
          path: artifacts/d1-performance-report.*
          if-no-files-found: warn
          retention-days: 30
