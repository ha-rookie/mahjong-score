name: Cloudflare Production Auto Deploy (Restored)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mahjong-score-production-auto-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Guard D1 migration safety
        run: npm run db:migrations:guard
      - name: Lint and test
        run: |
          set -euo pipefail
          npm run lint
          npm test
          node --test scripts/test-production-release-gate.mjs
      - name: Build and validate Production binding
        run: |
          set -euo pipefail
          npm run build
          npm run db:binding:guard
      - name: Validate migrations locally against existing data
        run: |
          set -euo pipefail
          npm run db:migrate:local
          npm run db:migrate:regression
      - name: Verify this commit is still current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Check previously configured Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Capture Production D1 time-travel recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --json > /tmp/prod-d1-recovery.json
          node scripts/production-release-gate.mjs recovery /tmp/prod-d1-recovery.json
      - name: Validate exact Production D1 applied/pending migration sequence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"sql":"SELECT name FROM d1_migrations ORDER BY id"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/95a84e69-692e-45f1-9762-0b71b298199b/query" \
            > /tmp/prod-d1-before.json
          node scripts/check-production-auto-release-migrations.mjs before /tmp/prod-d1-before.json /tmp/prod-d1-plan.json
      - name: Apply additive Production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod
      - name: Verify Production D1 migration ledger after apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"sql":"SELECT name FROM d1_migrations ORDER BY id"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/95a84e69-692e-45f1-9762-0b71b298199b/query" \
            > /tmp/prod-d1-after.json
          node scripts/check-production-auto-release-migrations.mjs after /tmp/prod-d1-after.json /tmp/prod-d1-plan.json
      - name: Recheck main SHA before Cloudflare Worker deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy to Cloudflare Workers Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify deployed Production D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name mahjong-score --json > /tmp/prod-deployment.json
          version_id="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/prod-deployment.json","utf8")); const versions=Array.isArray(d?.versions)?d.versions:[]; const active=versions.find(v=>Number(v.percentage)===100); if(!active?.version_id)process.exit(2); process.stdout.write(active.version_id)')"
          npx wrangler versions view "$version_id" --name mahjong-score --json > /tmp/production-worker-version.json
          npm run db:binding:verify-deployed
      - name: Verify public Production response headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -fsSI --retry 5 --retry-delay 2 --retry-all-errors 'https://mahjong-score.ha-rookie.workers.dev/' | tr -d '\r')"
          grep -Eqi "^content-security-policy: .*frame-ancestors 'none'" <<< "$headers"
          grep -Eqi "^strict-transport-security: *max-age=31536000" <<< "$headers"
          grep -Eqi "^x-frame-options: *DENY" <<< "$headers"
          grep -Eqi "^x-content-type-options: nosniff" <<< "$headers"
      - name: Verify public passkey enrollment capability after deploy
        shell: bash
        run: |
          set -euo pipefail
          capability="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors -H 'Cache-Control: no-cache' 'https://mahjong-score.ha-rookie.workers.dev/api/auth/passkey/capabilities')"
          CAPABILITY_JSON="$capability" node -e 'const d=JSON.parse(process.env.CAPABILITY_JSON??"null");if(d?.registrationEnabled!==true){console.error("Production passkey registration is not enabled");process.exit(1);}console.log("Production passkey registration capability enabled");'
