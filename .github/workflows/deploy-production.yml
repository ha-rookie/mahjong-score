name: App CI and Cloudflare Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahjong-score-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard Production migration safety
        run: npm run db:migrations:guard

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated Production D1 binding
        run: npm run db:binding:guard

      - name: Validate static security headers artifact
        run: |
          set -eu
          test -f dist/client/_headers
          grep -q "Content-Security-Policy:" dist/client/_headers
          grep -q "Strict-Transport-Security:" dist/client/_headers
          grep -q "X-Frame-Options: DENY" dist/client/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/client/_headers

      - name: Validate D1 migrations locally
        run: npm run db:migrate:local

      - name: Verify existing data survives future migrations
        run: npm run db:migrate:regression

      # Pull requests intentionally stop at local D1 validation.
      # Pushes to main and explicit workflow_dispatch runs deploy Production.

      - name: Validate deploy secrets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Capture Production D1 recovery point
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --json | tee /tmp/production-d1-pre-migration.json
          test -s /tmp/production-d1-pre-migration.json
          grep -q '"bookmark"' /tmp/production-d1-pre-migration.json

      - name: Apply D1 migrations to Production database
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod

      - name: Deploy to Cloudflare Workers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed Production D1 binding
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --name mahjong-score --json > /tmp/production-deployment.json
          version_id="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/production-deployment.json","utf8")); const versions=Array.isArray(d?.versions) ? d.versions : []; const active=versions.find((v)=>Number(v?.percentage)===100); if(!active?.version_id) { console.error("Expected one 100% active Production Worker version"); process.exit(2); } process.stdout.write(active.version_id);')"
          npx wrangler versions view "$version_id" --name mahjong-score --json > /tmp/production-worker-version.json
          npm run db:binding:verify-deployed

      - name: Verify Production security headers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          url="https://mahjong-score.ha-rookie.workers.dev/"
          headers="$(curl -fsSI --retry 5 --retry-delay 2 --retry-all-errors "$url" | tr -d '\r')"
          printf '%s\n' "$headers"
          grep -Eqi "^content-security-policy: .*frame-ancestors 'none'" <<<"$headers"
          grep -Eqi "^strict-transport-security: *max-age=31536000" <<<"$headers"
          grep -Eqi "^x-frame-options: *DENY" <<<"$headers"
          grep -Eqi "^x-content-type-options: *nosniff" <<<"$headers"
          grep -Eqi "^referrer-policy: *strict-origin-when-cross-origin" <<<"$headers"
          grep -Eqi "^permissions-policy:" <<<"$headers"
          grep -Eqi "^x-permitted-cross-domain-policies: *none" <<<"$headers"
