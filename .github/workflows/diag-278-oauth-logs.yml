name: Diagnose LINE OAuth logs

on:
  push:
    branches:
      - diag-278-oauth-logs
    paths:
      - .github/workflows/diag-278-oauth-logs.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Tail Worker and sanitize LINE OAuth audit logs for 4 minutes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          echo 'Starting unfiltered live tail; only sanitized LINE OAuth audit fields will be printed.'
          set +e
          timeout 240s npx --yes wrangler@latest tail mahjong-score --format json > raw-tail.log 2>tail-stderr.log
          rc=$?
          set -e

          echo "wrangler tail exit code: $rc"
          if [[ -s tail-stderr.log ]]; then
            echo 'Tail stderr (secrets are masked by GitHub):'
            cat tail-stderr.log
          fi

          echo 'Sanitized LINE OAuth audit events:'
          count=0
          while IFS= read -r line; do
            while IFS= read -r candidate; do
              parsed="$(printf '%s' "$candidate" | jq -c 'fromjson? | select(.kind == "audit" and (.event | startswith("line_login_"))) | {timestamp,event,outcome,reason,oauthFlowId,requestId,path}' 2>/dev/null || true)"
              if [[ -n "$parsed" ]]; then
                printf '%s\n' "$parsed"
                count=$((count+1))
              fi
            done < <(printf '%s' "$line" | jq -r '.. | strings | select(contains("line_login"))' 2>/dev/null || true)
          done < raw-tail.log
          echo "Sanitized event count: $count"

          if [[ "$count" -eq 0 ]]; then
            echo 'No LINE OAuth audit event was extracted. Printing only request method/path/status summaries from the tail:'
            jq -c '{eventTimestamp, outcome, event: {request: {method: .event.request.method, url: (.event.request.url | if type=="string" then split("?")[0] else . end)}, response: {status: .event.response.status}}}' raw-tail.log 2>/dev/null | head -n 100 || true
          fi

          if [[ "$rc" -ne 0 && "$rc" -ne 124 ]]; then
            exit "$rc"
          fi
