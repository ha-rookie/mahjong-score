name: Diagnose D1 Targets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and show generated D1 binding
        run: |
          set -euo pipefail
          npm run build
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("dist/mahjong_score/wrangler.json","utf8")); console.log(JSON.stringify({d1_databases:c.d1_databases,previews:c.previews},null,2));'
          echo "=== Wrangler deploy redirect config ==="
          cat .wrangler/deploy/config.json

      - name: Compare Production and Preview D1 counts (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          query="SELECT (SELECT COUNT(*) FROM groups) AS groups_count, (SELECT COUNT(*) FROM users) AS users_count, (SELECT COUNT(*) FROM group_memberships) AS memberships_count, (SELECT COUNT(*) FROM sessions) AS sessions_count, (SELECT COUNT(*) FROM games) AS games_count, (SELECT COUNT(*) FROM game_results) AS game_results_count, (SELECT COUNT(*) FROM chip_results) AS chip_results_count, (SELECT COUNT(*) FROM sessions WHERE note IS NOT NULL AND TRIM(note) <> '') AS session_memos_count, (SELECT MAX(session_date) FROM sessions) AS latest_session_date, (SELECT MAX(updated_at) FROM sessions) AS latest_session_updated_at;"

          echo "=== Production D1 counts ==="
          npx wrangler d1 execute DB --remote --command "$query" --json

          echo "=== Preview D1 counts ==="
          npx wrangler d1 execute DB --remote --preview --command "$query" --json

      - name: Inspect active Production deployment (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== Current deployment ==="
          npx wrangler deployments status --name mahjong-score --json | tee /tmp/deployment.json
          version_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8")); const versions=x.versions ?? x; const v=Array.isArray(versions) ? versions[0] : versions?.versions?.[0]; const id=v?.version_id ?? v?.versionId ?? v?.id; if(!id) process.exit(2); process.stdout.write(id);')"
          echo "=== Active version: $version_id ==="
          npx wrangler versions view "$version_id" --name mahjong-score --json
