name: Issue 299 scoped codemod

on:
  push:
    branches:
      - feature/299-game-result-placement-performance-metrics
    paths:
      - "scripts/issue-299-codemod.mjs"
      - ".github/workflows/issue-299-codemod.yml"

permissions:
  contents: write

jobs:
  apply-codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/299-game-result-placement-performance-metrics
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply exact replacements
        run: node scripts/issue-299-codemod.mjs
      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.ts src/App.tsx
          git diff --cached --exit-code && { echo "Expected source changes were not produced"; exit 1; } || true
          git commit -m "feat: persist placements and show performance win rates (#299)"
          git push origin HEAD:feature/299-game-result-placement-performance-metrics
