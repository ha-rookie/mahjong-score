name: Issue 301 scoped codemod

on:
  push:
    branches:
      - feature/301-sliding-auth-session-relogin
    paths:
      - '.github/workflows/issue-301-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/301-sliding-auth-session-relogin
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Update design for sliding authentication session
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f"{path}: expected exactly one design anchor, found {text.count(old)}")
              p.write_text(text.replace(old,new))

          replace_once('docs/09_FUNCTION_DESIGN.md',
          '## FUNC-009 0半荘Session取り消し\n',
          '''## FUNC-008 認証セッション継続 / 401再ログイン\n- application sessionは発行時点から24時間を基本有効期限とする\n- `GET /api/auth/me` で有効なsessionを確認した際、残り有効時間が12時間以下ならsigned payloadの`exp`とHttpOnly Cookieの`Max-Age`を同時に24時間へ更新する\n- Browserは通常操作のたびにCookieを再発行させず、最後の認証確認から1時間以上経過したprotected API操作の直前だけ`/api/auth/me`を確認する\n- 24時間以上操作がなくsessionがexpiredした場合は従来どおり401とする\n- protected APIの401はnetwork failureと区別し、「ログインの有効期限が切れました。もう一度ログインしてください。」として扱う\n- runtime中の401ではApp本体をunauthenticatedへ初期化せず、再ログインDialogを重ねてScore / Chip / Session memo等のReact stateを保持する\n- 再ログインは別WindowでLINE authorizationを開始し、元Windowは`/api/auth/me`で復帰を確認する。成功後はDialogを閉じ、Userが失敗した保存操作を再実行できる\n- 初期表示時に既にsessionがexpiredしている場合は、未保存入力が存在しないため従来のlogin gateを使用する\n- 明示logoutは従来どおりsessionを破棄し、Appの認証状態をunauthenticatedへ遷移する\n- LINE Login / Invitation / logoutの既存flowを変更しない\n\n## FUNC-009 0半荘Session取り消し\n''')

          replace_once('docs/12_INTERFACE_IO_DESIGN.md',
          'The Worker completes the LINE Login v2.1 authorization-code flow server-side. The callback exchanges the authorization code for an ID token, verifies the ID token with LINE using the original nonce and Channel ID, upserts the LINE external identity/User in D1, and issues a 24-hour HttpOnly/Secure/SameSite=Lax application session cookie.\n',
          '''The Worker completes the LINE Login v2.1 authorization-code flow server-side. The callback exchanges the authorization code for an ID token, verifies the ID token with LINE using the original nonce and Channel ID, upserts the LINE external identity/User in D1, and issues an HttpOnly/Secure/SameSite=Lax application session cookie with an initial 24-hour lifetime.\n\nIssue #301以降、application sessionはsliding expirationとする。`GET /api/auth/me`で有効なsessionを解決した時点でsigned payloadの残り有効時間が12時間以下なら、新しい`exp = now + 24h`を署名したsessionを発行し、Cookie `Max-Age=86400`も同時に更新する。残り12時間超ではCookieを再発行しない。Browserはprotected API操作の直前に最大1時間に1回だけ`/api/auth/me`をpreflightし、active use中のsessionを更新可能にする。24時間以上無操作ならsessionはexpiredし401になる。\n\nRuntime中のprotected API 401は、Browser側でnetwork errorと区別して`mahjong:auth-expired`として扱う。App本体はunmount/initializationせず、再ログインDialogを重ねることで入力途中のScore / Chip / Session memoを保持する。再ログインは`GET /api/auth/line/start?response=json`でauthorization URLを取得して別WindowでLINE Loginを行い、元Windowが`GET /api/auth/me`成功を確認して復帰する。401を受けた元mutationは自動再送せず、Userが内容を確認して再実行する。\n''')

          replace_once('docs/02_SYSTEM_ARCHITECTURE.md',
          '## 15. Initial administrator and authorization\n',
          '''### 14.1 Application session continuity\n\nLINE Login完了時のapplication sessionは24時間有効のsigned HttpOnly Cookieとして開始する。active use中に固定24時間で突然失効しないよう、Browserはprotected API操作時に最大1時間に1回`/api/auth/me`をpreflightし、Workerは残り12時間以下の有効sessionだけ24時間へ更新する。signed payloadの`exp`とCookie `Max-Age`は同時に更新し、毎requestのCookie再発行は行わない。\n\n24時間以上無操作でsessionが失効した場合、protected APIは401を返す。Browserは401を通信障害と区別し、現在のSPA stateを保持したまま再ログインDialogを表示する。再ログインは別WindowのLINE authorizationで行い、元Windowが同一originの`/api/auth/me`成功を確認した後に通常操作へ戻す。明示logoutと初期表示時のunauthenticated login gateは従来どおりとする。\n\n## 15. Initial administrator and authorization\n''')
          PY
          git add docs/09_FUNCTION_DESIGN.md docs/12_INTERFACE_IO_DESIGN.md docs/02_SYSTEM_ARCHITECTURE.md
          git commit -m "docs: define sliding auth session recovery"

      - name: Implement issue 301
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f"{path}: expected exactly one implementation anchor, found {count}")
              p.write_text(text.replace(old,new))

          p=Path('src/worker/auth/line-login.ts')
          text=p.read_text()
          old='const safeEqual=(a:string,b:string)=>{if(a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a.charCodeAt(i)^b.charCodeAt(i);return x===0;};\nconst makeSession=async(userId:string,secret:string)=>{const payload=base64url(enc.encode(JSON.stringify({userId,exp:Math.floor(Date.now()/1000)+86400})));return payload+"."+await sign(payload,secret);};'
          new='''const safeEqual=(a:string,b:string)=>{if(a.length!==b.length)return false;let x=0;for(let i=0;i<a.length;i++)x|=a.charCodeAt(i)^b.charCodeAt(i);return x===0;};\nexport const AUTH_SESSION_TTL_SECONDS=24*60*60;\nexport const AUTH_SESSION_RENEW_WINDOW_SECONDS=12*60*60;\nconst sessionCookieValue=(value:string,maxAge=AUTH_SESSION_TTL_SECONDS)=>`mahjong_session=${value}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${maxAge}`;\nconst makeSession=async(userId:string,secret:string,nowSeconds=Math.floor(Date.now()/1000))=>{const payload=base64url(enc.encode(JSON.stringify({userId,exp:nowSeconds+AUTH_SESSION_TTL_SECONDS})));return payload+"."+await sign(payload,secret);};'''
          if text.count(old)!=1: raise SystemExit('line-login session creation anchor mismatch')
          text=text.replace(old,new)

          old='''type SessionResolution={userId:string|null;status:"secret_missing"|"cookie_missing"|"malformed"|"bad_signature"|"invalid_payload"|"expired"|"valid"};\nconst resolveSession=async(request:Request,env:AuthEnv):Promise<SessionResolution>=>{\n  if(!env.AUTH_SESSION_SECRET)return {userId:null,status:"secret_missing"};\n  const raw=cookie(request,"mahjong_session");\n  if(!raw)return {userId:null,status:"cookie_missing"};\n  const [payload,sig,...extra]=raw.split(".");\n  if(!payload||!sig||extra.length)return {userId:null,status:"malformed"};\n  if(!safeEqual(await sign(payload,env.AUTH_SESSION_SECRET),sig))return {userId:null,status:"bad_signature"};\n  try{\n    const padded=payload.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(payload.length/4)*4,"=");\n    const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(padded),c=>c.charCodeAt(0)))) as {userId?:string;exp?:number};\n    if(!data.userId||!data.exp)return {userId:null,status:"invalid_payload"};\n    if(data.exp<=Math.floor(Date.now()/1000))return {userId:null,status:"expired"};\n    return {userId:data.userId,status:"valid"};\n  }catch{return {userId:null,status:"invalid_payload"};}\n};'''
          new='''type SessionResolution={userId:string|null;expiresAt:number|null;status:"secret_missing"|"cookie_missing"|"malformed"|"bad_signature"|"invalid_payload"|"expired"|"valid"};\nconst resolveSession=async(request:Request,env:AuthEnv):Promise<SessionResolution>=>{\n  if(!env.AUTH_SESSION_SECRET)return {userId:null,expiresAt:null,status:"secret_missing"};\n  const raw=cookie(request,"mahjong_session");\n  if(!raw)return {userId:null,expiresAt:null,status:"cookie_missing"};\n  const [payload,sig,...extra]=raw.split(".");\n  if(!payload||!sig||extra.length)return {userId:null,expiresAt:null,status:"malformed"};\n  if(!safeEqual(await sign(payload,env.AUTH_SESSION_SECRET),sig))return {userId:null,expiresAt:null,status:"bad_signature"};\n  try{\n    const padded=payload.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(payload.length/4)*4,"=");\n    const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(padded),c=>c.charCodeAt(0)))) as {userId?:string;exp?:number};\n    if(!data.userId||!data.exp)return {userId:null,expiresAt:null,status:"invalid_payload"};\n    if(data.exp<=Math.floor(Date.now()/1000))return {userId:null,expiresAt:data.exp,status:"expired"};\n    return {userId:data.userId,expiresAt:data.exp,status:"valid"};\n  }catch{return {userId:null,expiresAt:null,status:"invalid_payload"};}\n};'''
          if text.count(old)!=1: raise SystemExit('line-login resolveSession anchor mismatch')
          text=text.replace(old,new)

          old='return new Response(null,{status:302,headers:{location:destination.toString(),"set-cookie":"mahjong_session="+session+"; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400"}});'
          new='return new Response(null,{status:302,headers:{location:destination.toString(),"set-cookie":sessionCookieValue(session)}});'
          if text.count(old)!=1: raise SystemExit('line-login callback cookie anchor mismatch')
          text=text.replace(old,new)

          old='''  const memberships=await env.DB.prepare("SELECT gm.group_id AS groupId,g.name AS groupName,gm.role,gp.player_id AS playerId,p.display_name AS playerDisplayName FROM group_memberships gm JOIN groups g ON g.id=gm.group_id LEFT JOIN group_players gp ON gp.group_id=gm.group_id AND gp.user_id=gm.user_id LEFT JOIN players p ON p.id=gp.player_id WHERE gm.user_id=? ORDER BY gm.created_at,gm.group_id").bind(userId).all();\n  auditAuth(request,"auth_session_resolved","success",{userId,resourceType:"authentication",reason:"membership_count="+memberships.results.length});\n  const anyAdmin=await env.DB.prepare("SELECT 1 AS ok FROM users WHERE system_role='admin' LIMIT 1").first();\n  return new Response(JSON.stringify({authenticated:true,user,memberships:memberships.results,canBootstrapAdmin:!anyAdmin}),{headers:{"content-type":"application/json; charset=utf-8"}});'''
          new='''  const memberships=await env.DB.prepare("SELECT gm.group_id AS groupId,g.name AS groupName,gm.role,gp.player_id AS playerId,p.display_name AS playerDisplayName FROM group_memberships gm JOIN groups g ON g.id=gm.group_id LEFT JOIN group_players gp ON gp.group_id=gm.group_id AND gp.user_id=gm.user_id LEFT JOIN players p ON p.id=gp.player_id WHERE gm.user_id=? ORDER BY gm.created_at,gm.group_id").bind(userId).all();\n  auditAuth(request,"auth_session_resolved","success",{userId,resourceType:"authentication",reason:"membership_count="+memberships.results.length});\n  const anyAdmin=await env.DB.prepare("SELECT 1 AS ok FROM users WHERE system_role='admin' LIMIT 1").first();\n  const headers=new Headers({"content-type":"application/json; charset=utf-8","cache-control":"no-store"});\n  const nowSeconds=Math.floor(Date.now()/1000);\n  if(session.expiresAt!==null&&session.expiresAt-nowSeconds<=AUTH_SESSION_RENEW_WINDOW_SECONDS&&env.AUTH_SESSION_SECRET){\n    const renewed=await makeSession(userId,env.AUTH_SESSION_SECRET,nowSeconds);\n    headers.set("set-cookie",sessionCookieValue(renewed));\n    auditAuth(request,"auth_session_renewed","success",{userId,resourceType:"authentication",reason:"sliding_expiration"});\n  }\n  return new Response(JSON.stringify({authenticated:true,user,memberships:memberships.results,canBootstrapAdmin:!anyAdmin}),{headers});'''
          if text.count(old)!=1: raise SystemExit('line-login authMe anchor mismatch')
          p.write_text(text.replace(old,new))

          Path('src/infrastructure/api/browser-auth-session.ts').write_text('''export const AUTH_SESSION_EXPIRED_EVENT="mahjong:auth-expired";\nexport const AUTH_CHECK_INTERVAL_MS=60*60*1000;\n\nconst authControlPaths=new Set([\n  "/api/auth/me",\n  "/api/auth/line/start",\n  "/api/auth/line/callback",\n  "/api/auth/logout",\n]);\n\nexport const isProtectedApiPath=(pathname:string):boolean=>\n  pathname.startsWith("/api/")&&!authControlPaths.has(pathname)&&pathname!=="/api/health";\n\nlet installed=false;\n\nexport const installBrowserAuthSessionGuard=()=>{\n  if(installed)return;\n  installed=true;\n  const nativeFetch=window.fetch.bind(window);\n  let lastSuccessfulAuthCheckAt=0;\n  let authCheckInFlight:Promise<"valid"|"expired"|"unknown">|null=null;\n  let expiryEventSent=false;\n\n  const notifyExpired=()=>{\n    if(expiryEventSent)return;\n    expiryEventSent=true;\n    window.dispatchEvent(new CustomEvent(AUTH_SESSION_EXPIRED_EVENT));\n  };\n\n  const authCheck=async():Promise<"valid"|"expired"|"unknown">=>{\n    if(Date.now()-lastSuccessfulAuthCheckAt<AUTH_CHECK_INTERVAL_MS)return "valid";\n    if(authCheckInFlight)return authCheckInFlight;\n    authCheckInFlight=(async()=>{\n      try{\n        const response=await nativeFetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});\n        if(response.ok){lastSuccessfulAuthCheckAt=Date.now();expiryEventSent=false;return "valid";}\n        if(response.status===401){notifyExpired();return "expired";}\n        return "unknown";\n      }catch{return "unknown";}\n    })();\n    try{return await authCheckInFlight;}finally{authCheckInFlight=null;}\n  };\n\n  window.fetch=async(input:RequestInfo|URL,init?:RequestInit):Promise<Response>=>{\n    const rawUrl=input instanceof Request?input.url:typeof input==="string"?input:input.toString();\n    const url=new URL(rawUrl,window.location.href);\n    const sameOrigin=url.origin===window.location.origin;\n\n    if(sameOrigin&&url.pathname==="/api/auth/me"){\n      const response=await nativeFetch(input,init);\n      if(response.ok){lastSuccessfulAuthCheckAt=Date.now();expiryEventSent=false;}\n      return response;\n    }\n\n    if(sameOrigin&&isProtectedApiPath(url.pathname)){\n      const state=await authCheck();\n      if(state==="expired")return new Response(JSON.stringify({error:{code:"unauthorized",message:"Authentication required"}}),{status:401,statusText:"Unauthorized",headers:{"content-type":"application/json; charset=utf-8"}});\n      const response=await nativeFetch(input,init);\n      if(response.status===401)notifyExpired();\n      return response;\n    }\n\n    return nativeFetch(input,init);\n  };\n};\n''')

          Path('src/components/auth-session-recovery.tsx').write_text('''import { useEffect, useState } from "react";\nimport { Button } from "./ui";\nimport { AUTH_SESSION_EXPIRED_EVENT } from "../infrastructure/api/browser-auth-session";\n\nconst sleep=(ms:number)=>new Promise(resolve=>window.setTimeout(resolve,ms));\n\nexport function AuthSessionRecovery(){\n  const [expired,setExpired]=useState(false);\n  const [busy,setBusy]=useState(false);\n  const [error,setError]=useState<string|null>(null);\n\n  useEffect(()=>{\n    const handleExpired=()=>{setExpired(true);setError(null);};\n    window.addEventListener(AUTH_SESSION_EXPIRED_EVENT,handleExpired);\n    return()=>window.removeEventListener(AUTH_SESSION_EXPIRED_EVENT,handleExpired);\n  },[]);\n\n  const reauthenticate=async()=>{\n    setBusy(true);setError(null);\n    const popup=window.open("about:blank","mahjong-reauth","popup=yes,width=480,height=720");\n    if(!popup){setBusy(false);setError("再ログイン画面を開けませんでした。ポップアップを許可して、もう一度お試しください。");return;}\n    try{\n      popup.opener=null;\n      const start=await fetch("/api/auth/line/start?response=json",{credentials:"same-origin",cache:"no-store"});\n      if(!start.ok)throw new Error("start");\n      const payload=await start.json() as {authorizationUrl?:string};\n      if(!payload.authorizationUrl)throw new Error("authorization-url");\n      popup.location.href=payload.authorizationUrl;\n      for(let i=0;i<120;i++){\n        await sleep(1000);\n        if(popup.closed)throw new Error("popup-closed");\n        try{\n          const response=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});\n          if(response.ok){popup.close();setExpired(false);setBusy(false);setError(null);return;}\n        }catch{\n          // Keep polling while the authentication window is open.\n        }\n      }\n      throw new Error("timeout");\n    }catch(cause){\n      if(!popup.closed)popup.close();\n      setBusy(false);\n      setError(cause instanceof Error&&cause.message==="popup-closed"?"再ログインが完了していません。もう一度お試しください。":"再ログインを確認できませんでした。入力内容は保持しています。もう一度お試しください。");\n    }\n  };\n\n  if(!expired)return null;\n  return <div className="confirm-backdrop" role="presentation">\n    <div className="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-expired-title">\n      <div className="confirm-dialog__icon" aria-hidden="true">!</div>\n      <h2 id="auth-expired-title">ログインの有効期限が切れました</h2>\n      <p>入力途中の内容はそのまま保持しています。もう一度LINEでログインしたあと、保存操作を再実行してください。</p>\n      {error?<p className="auth-status__error" role="alert">{error}</p>:null}\n      <div className="confirm-dialog__actions">\n        <Button disabled={busy} onClick={()=>void reauthenticate()}>{busy?"再ログインを確認しています…":"LINEで再ログイン"}</Button>\n      </div>\n    </div>\n  </div>;\n}\n''')

          Path('src/infrastructure/api/worker-api-client.ts').write_text('''import { AppError, err, ok, type Result } from "../../shared/errors";\nexport class WorkerApiClient {\n  constructor(private readonly baseUrl = "") {}\n  async request<T>(path:string,init:RequestInit={}):Promise<Result<T>>{try{const response=await fetch(this.baseUrl+path,{...init,headers:{...init.headers,...(init.body?{"content-type":"application/json"}:{})}});if(response.status===204)return response.ok?ok(undefined as T):err(new AppError({code:"api_error",message:"API request failed: "+response.status,userMessage:"通信に失敗しました。",retryable:response.status>=500}));const raw=await response.text();const payload=(raw?JSON.parse(raw):undefined) as T|{error?:{code?:string;message?:string}}|undefined;if(!response.ok){const e=(payload as {error?:{code?:string;message?:string}}|undefined)?.error;const code=e?.code??"api_error";const userMessage=response.status===401?"ログインの有効期限が切れました。もう一度ログインしてください。":code==="stale_update"?"他の端末で更新されています。画面を更新してからもう一度操作してください。":"通信に失敗しました。";return err(new AppError({code,message:e?.message??("API request failed: "+response.status),userMessage,retryable:response.status>=500}));}return ok(payload as T);}catch(cause){return err(new AppError({code:"api_network_error",message:"Worker API request failed.",userMessage:"通信状態を確認してください。",retryable:true,cause}));}}\n}\n''')

          replace_once('src/main.tsx',
          'import App from "./App";\n',
          'import App from "./App";\nimport { AuthSessionRecovery } from "./components/auth-session-recovery";\nimport { installBrowserAuthSessionGuard } from "./infrastructure/api/browser-auth-session";\n')
          replace_once('src/main.tsx',
          'createRoot(document.getElementById("root")!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n',
          'installBrowserAuthSessionGuard();\ncreateRoot(document.getElementById("root")!).render(\n  <StrictMode>\n    <App />\n    <AuthSessionRecovery />\n  </StrictMode>,\n);\n')

          Path('tests/auth-session-sliding.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport worker from "../src/worker";\nimport { AUTH_SESSION_TTL_SECONDS } from "../src/worker/auth/line-login";\n\nconst secret="test-session-secret-at-least-32-characters";\nconst enc=new TextEncoder();\nconst base64url=(bytes:Uint8Array)=>Buffer.from(bytes).toString("base64").replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/,"");\nconst signedCookie=async(userId:string,exp:number)=>{\n  const payload=base64url(enc.encode(JSON.stringify({userId,exp})));\n  const key=await crypto.subtle.importKey("raw",enc.encode(secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);\n  const sig=base64url(new Uint8Array(await crypto.subtle.sign("HMAC",key,enc.encode(payload))));\n  return `mahjong_session=${payload}.${sig}`;\n};\n\nclass AuthStatement {\n  constructor(private readonly sql:string){}\n  bind(){return this;}\n  async first<T>():Promise<T|null>{\n    if(this.sql.includes("FROM users WHERE id=?"))return {id:"u1",displayName:"User",systemRole:"user"} as T;\n    if(this.sql.includes("system_role='admin'"))return {ok:1} as T;\n    return null;\n  }\n  async all<T>():Promise<{results:T[]}>{return {results:[]};}\n}\nclass AuthDb {prepare(sql:string){return new AuthStatement(sql);}}\nconst env={DB:new AuthDb() as unknown as D1Database,ASSETS:{fetch:async()=>new Response("asset")} as unknown as Fetcher,AUTH_SESSION_SECRET:secret};\n\nconst decodedExpiry=(setCookie:string)=>{\n  const raw=/mahjong_session=([^;]+)/.exec(setCookie)?.[1];\n  assert.ok(raw);\n  const payload=raw.split(".")[0].replace(/-/g,"+").replace(/_/g,"/");\n  return (JSON.parse(Buffer.from(payload,"base64").toString("utf8")) as {exp:number}).exp;\n};\n\ntest("auth/me does not renew a session with more than 12 hours remaining",async()=>{\n  const now=Math.floor(Date.now()/1000);\n  const response=await worker.fetch(new Request("https://example.test/api/auth/me",{headers:{cookie:await signedCookie("u1",now+13*60*60)}}),env);\n  assert.equal(response.status,200);\n  assert.equal(response.headers.get("set-cookie"),null);\n});\n\ntest("auth/me renews signed exp and cookie lifetime inside the 12 hour window",async()=>{\n  const now=Math.floor(Date.now()/1000);\n  const oldExp=now+11*60*60;\n  const response=await worker.fetch(new Request("https://example.test/api/auth/me",{headers:{cookie:await signedCookie("u1",oldExp)}}),env);\n  assert.equal(response.status,200);\n  const setCookie=response.headers.get("set-cookie")??"";\n  assert.match(setCookie,/Max-Age=86400/);\n  const renewedExp=decodedExpiry(setCookie);\n  assert.ok(renewedExp>oldExp);\n  assert.ok(Math.abs(renewedExp-(Math.floor(Date.now()/1000)+AUTH_SESSION_TTL_SECONDS))<=2);\n  assert.equal(response.headers.get("cache-control"),"no-store");\n});\n\ntest("auth/me still rejects an idle expired session",async()=>{\n  const response=await worker.fetch(new Request("https://example.test/api/auth/me",{headers:{cookie:await signedCookie("u1",Math.floor(Date.now()/1000)-1)}}),env);\n  assert.equal(response.status,401);\n});\n''')

          Path('tests/worker-api-client-auth.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { WorkerApiClient } from "../src/infrastructure/api/worker-api-client";\nimport { isProtectedApiPath } from "../src/infrastructure/api/browser-auth-session";\n\ntest("WorkerApiClient maps 401 to an authentication-expiry message",async()=>{\n  const original=globalThis.fetch;\n  globalThis.fetch=async()=>new Response(JSON.stringify({error:{code:"unauthorized",message:"Authentication required"}}),{status:401,headers:{"content-type":"application/json"}});\n  try{\n    const result=await new WorkerApiClient().request<{ok:boolean}>("/api/groups");\n    assert.equal(result.ok,false);\n    if(result.ok)return;\n    assert.equal(result.error.code,"unauthorized");\n    assert.equal(result.error.userMessage,"ログインの有効期限が切れました。もう一度ログインしてください。");\n    assert.equal(result.error.retryable,false);\n  }finally{globalThis.fetch=original;}\n});\n\ntest("browser auth guard classifies protected and control API paths",()=>{\n  assert.equal(isProtectedApiPath("/api/groups"),true);\n  assert.equal(isProtectedApiPath("/api/auth/bootstrap-admin"),true);\n  assert.equal(isProtectedApiPath("/api/auth/me"),false);\n  assert.equal(isProtectedApiPath("/api/auth/line/start"),false);\n  assert.equal(isProtectedApiPath("/api/auth/logout"),false);\n  assert.equal(isProtectedApiPath("/api/health"),false);\n});\n''')
