name: Issue 303 scoped codemod

on:
  push:
    branches:
      - feature/303-admin-finalized-game-correction
    paths:
      - '.github/workflows/issue-303-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/303-admin-finalized-game-correction
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Update design before implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          additions={
            'docs/09_FUNCTION_DESIGN.md': '''\n\n## FUNC-010 確定済み半荘結果の管理者訂正\n- 確定済みSessionのGameは通常ユーザーおよびGroup Adminには引き続きread-onlyとする\n- System AdminだけがHistoryのSession結果から半荘Score Pointを訂正できる\n- 訂正画面は現在値を初期表示し、保存前に確定済みデータ変更の確認を必須とする\n- Game削除、Session参加者、開催日、チップ、Sessionメモの変更は本機能の対象外とする\n- 保存時は既存Game validation、`expectedVersion`、参加者一致、Score Point合計0を維持する\n- `placement` / `is_last` は訂正後Score Pointから再計算して同時更新する\n- 成功・拒否・競合・更新失敗は `finalized_game_corrected` のaudit eventで追跡可能にする\n''',
            'docs/10_SCREEN_DESIGN.md': '''\n\n## 確定済み半荘結果の訂正（System Admin）\n- 過去の麻雀のSession結果では、System Adminにだけ各半荘の編集アイコンを表示する\n- 編集アイコン選択後、対象半荘の現在Score Pointを入力欄へ復元する\n- 合計0・整数・値域の条件を満たし、かつ値が変更された場合のみ保存可能とする\n- 保存直前に「確定済みの過去データを修正する」確認を表示する\n- 保存成功後はSession結果を再取得し、集計表示を最新値へ更新する\n- Group Admin / Memberには編集導線を表示しない\n''',
            'docs/12_INTERFACE_IO_DESIGN.md': '''\n\n### PUT /api/games/:gameId - finalized Game correction\n- active Sessionの既存Game更新仕様は維持する\n- Sessionが`finalized`の場合はSystem Adminだけ更新可能とし、Member / Group Adminには403を返す\n- `expectedVersion`によるoptimistic concurrencyを維持する\n- Score Point合計0、参加者一致、値域、Game Tag validationを既存更新と共通化する\n- 訂正後は`placement` / `is_last`を再計算し、GameResultとGame versionを同一更新単位で保存する\n- Session versionも更新し、Session詳細の競合検知を維持する\n- 監査ログ`finalized_game_corrected`にはuser、group、game、session識別情報とoutcomeを残し、Score値そのものは記録しない\n''',
          }
          for name, addition in additions.items():
              path=Path(name)
              text=path.read_text()
              marker=addition.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip()+addition+'\n')
          PY
          git add docs/09_FUNCTION_DESIGN.md docs/10_SCREEN_DESIGN.md docs/12_INTERFACE_IO_DESIGN.md
          git commit -m "docs: define admin correction for finalized games"

      - name: Implement finalized Game correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old,new))

          # Worker: System Admin only for finalized Game PUT; active flow remains unchanged.
          replace_once('src/worker.ts',
          '''   if(request.method==="PUT"){\n     if(base.status!=="active")return bad("session_not_active","Finalized Session is read-only",409);\n''',
          '''   if(request.method==="PUT"){\n     const correctingFinalized=base.status==="finalized";\n     const auditFinalizedCorrection=(outcome:"success"|"failure",reason:string)=>{if(correctingFinalized)writeAuditLog({event:"finalized_game_corrected",requestId,method:request.method,path:url.pathname,outcome,userId:authUserId,groupId,resourceType:"game",resourceId:gameId,reason:`${reason};session_id=${String(base.sessionId)}`});};\n     if(correctingFinalized&&!await isSystemAdmin(env,authUserId)){auditFinalizedCorrection("failure","system_admin_required");return deny("System admin role required to correct finalized Game");}\n     if(base.status!=="active"&&!correctingFinalized)return bad("session_not_active","Session is not writable",409);\n''')

          replace_once('src/worker.ts',
          '''     if(!segmentId||!playedAt||!Number.isInteger(sequence)||expectedVersion===null||![3,4].includes(parsed.length)||parsed.some(v=>!v.playerId||v.scorePoint===null||Math.abs(v.scorePoint)>GAME_SCORE_ABS_MAX)||new Set(parsed.map(v=>v.playerId)).size!==parsed.length||parsed.reduce((n,v)=>n+(v.scorePoint??0),0)!==0||parsedTags.some(v=>!v.type))return bad("invalid_game","Game payload is invalid");const placements=deriveGameResultPlacements(parsed.map(v=>({playerId:v.playerId as string,scorePoint:v.scorePoint as number})));if(!placements)return bad("invalid_game_first_place_tie","Highest Score Point must be unique",400);const placementByPlayer=new Map(placements.map(v=>[v.playerId,v]));const segment=await env.DB.prepare("SELECT id FROM participant_segments WHERE id=? AND session_id=?").bind(segmentId,String(base.sessionId)).first();if(!segment)return bad("invalid_game_segment","Segment must belong to the Game Session");const segmentPlayers=await env.DB.prepare("SELECT player_id AS playerId FROM segment_players WHERE segment_id=? ORDER BY seat_order").bind(segmentId).all();const expectedPlayers=(segmentPlayers.results as Array<{playerId:string}>).map(v=>v.playerId),actualPlayers=parsed.map(v=>v.playerId as string);if(![3,4].includes(expectedPlayers.length)||expectedPlayers.length!==actualPlayers.length||expectedPlayers.some(id=>!actualPlayers.includes(id)))return bad("invalid_game_participants","Game results must match the Session participants");\n''',
          '''     if(!segmentId||!playedAt||!Number.isInteger(sequence)||expectedVersion===null||![3,4].includes(parsed.length)||parsed.some(v=>!v.playerId||v.scorePoint===null||Math.abs(v.scorePoint)>GAME_SCORE_ABS_MAX)||new Set(parsed.map(v=>v.playerId)).size!==parsed.length||parsed.reduce((n,v)=>n+(v.scorePoint??0),0)!==0||parsedTags.some(v=>!v.type)){auditFinalizedCorrection("failure","invalid_game");return bad("invalid_game","Game payload is invalid");}\n     const placements=deriveGameResultPlacements(parsed.map(v=>({playerId:v.playerId as string,scorePoint:v.scorePoint as number})));if(!placements){auditFinalizedCorrection("failure","invalid_game_first_place_tie");return bad("invalid_game_first_place_tie","Highest Score Point must be unique",400);}\n     const placementByPlayer=new Map(placements.map(v=>[v.playerId,v]));const segment=await env.DB.prepare("SELECT id FROM participant_segments WHERE id=? AND session_id=?").bind(segmentId,String(base.sessionId)).first();if(!segment){auditFinalizedCorrection("failure","invalid_game_segment");return bad("invalid_game_segment","Segment must belong to the Game Session");}\n     const segmentPlayers=await env.DB.prepare("SELECT player_id AS playerId FROM segment_players WHERE segment_id=? ORDER BY seat_order").bind(segmentId).all();const expectedPlayers=(segmentPlayers.results as Array<{playerId:string}>).map(v=>v.playerId),actualPlayers=parsed.map(v=>v.playerId as string);if(![3,4].includes(expectedPlayers.length)||expectedPlayers.length!==actualPlayers.length||expectedPlayers.some(id=>!actualPlayers.includes(id))){auditFinalizedCorrection("failure","invalid_game_participants");return bad("invalid_game_participants","Game results must match the Session participants");}\n''')

          replace_once('src/worker.ts',
          '''       const activeVersionSql="EXISTS(SELECT 1 FROM games gx JOIN sessions sx ON sx.id=gx.session_id WHERE gx.id=? AND gx.version=? AND sx.status='active')";\n       const rs=await env.DB.batch([\n         env.DB.prepare("UPDATE sessions SET version=version+1 WHERE id=? AND status='active' AND EXISTS(SELECT 1 FROM games WHERE id=? AND version=?)").bind(String(base.sessionId),gameId,expectedVersion),\n         env.DB.prepare(`DELETE FROM game_results WHERE game_id=? AND ${activeVersionSql}`).bind(gameId,gameId,expectedVersion),\n         ...parsed.map(v=>{const placement=placementByPlayer.get(v.playerId as string)!;return env.DB.prepare(`INSERT INTO game_results(game_id,player_id,rank,score_point,placement,is_last) SELECT ?,?,?,?,?,? WHERE ${activeVersionSql}`).bind(gameId,v.playerId,v.rank,v.scorePoint,placement.placement,placement.isLast?1:0,gameId,expectedVersion);}),\n         env.DB.prepare(`DELETE FROM game_tags WHERE game_id=? AND ${activeVersionSql}`).bind(gameId,gameId,expectedVersion),\n         ...parsedTags.map(v=>env.DB.prepare(`INSERT INTO game_tags(game_id,tag_order,type,player_id) SELECT ?,?,?,? WHERE ${activeVersionSql}`).bind(gameId,v.order,v.type,v.playerId,gameId,expectedVersion)),\n         env.DB.prepare("UPDATE games SET segment_id=?,sequence=?,played_at=?,version=version+1 WHERE id=? AND version=? AND EXISTS(SELECT 1 FROM sessions WHERE id=games.session_id AND status='active')").bind(segmentId,sequence,playedAt,gameId,expectedVersion),\n       ]);\n       const rootUpdated=rs[0]?.meta.changes??0,updated=rs[rs.length-1]?.meta.changes??0;if(rootUpdated!==1||updated!==1)return bad("stale_update","Game was updated by another client",409);\n       return json({ok:true,version:expectedVersion+1});\n     }catch{return bad("game_update_failed","Game could not be updated",409);}\n''',
          '''       const writableStatus=correctingFinalized?"finalized":"active";\n       const writableVersionSql=`EXISTS(SELECT 1 FROM games gx JOIN sessions sx ON sx.id=gx.session_id WHERE gx.id=? AND gx.version=? AND sx.status='${writableStatus}')`;\n       const rs=await env.DB.batch([\n         env.DB.prepare("UPDATE sessions SET version=version+1 WHERE id=? AND status=? AND EXISTS(SELECT 1 FROM games WHERE id=? AND version=?)").bind(String(base.sessionId),writableStatus,gameId,expectedVersion),\n         env.DB.prepare(`DELETE FROM game_results WHERE game_id=? AND ${writableVersionSql}`).bind(gameId,gameId,expectedVersion),\n         ...parsed.map(v=>{const placement=placementByPlayer.get(v.playerId as string)!;return env.DB.prepare(`INSERT INTO game_results(game_id,player_id,rank,score_point,placement,is_last) SELECT ?,?,?,?,?,? WHERE ${writableVersionSql}`).bind(gameId,v.playerId,v.rank,v.scorePoint,placement.placement,placement.isLast?1:0,gameId,expectedVersion);}),\n         env.DB.prepare(`DELETE FROM game_tags WHERE game_id=? AND ${writableVersionSql}`).bind(gameId,gameId,expectedVersion),\n         ...parsedTags.map(v=>env.DB.prepare(`INSERT INTO game_tags(game_id,tag_order,type,player_id) SELECT ?,?,?,? WHERE ${writableVersionSql}`).bind(gameId,v.order,v.type,v.playerId,gameId,expectedVersion)),\n         env.DB.prepare("UPDATE games SET segment_id=?,sequence=?,played_at=?,version=version+1 WHERE id=? AND version=? AND EXISTS(SELECT 1 FROM sessions WHERE id=games.session_id AND status=?)").bind(segmentId,sequence,playedAt,gameId,expectedVersion,writableStatus),\n       ]);\n       const rootUpdated=rs[0]?.meta.changes??0,updated=rs[rs.length-1]?.meta.changes??0;if(rootUpdated!==1||updated!==1){auditFinalizedCorrection("failure","stale_update");return bad("stale_update","Game was updated by another client",409);}\n       auditFinalizedCorrection("success","updated");\n       return json({ok:true,version:expectedVersion+1});\n     }catch{auditFinalizedCorrection("failure","game_update_failed");return bad("game_update_failed","Game could not be updated",409);}\n''')

          # Add correction component.
          Path('src/components/finalized-game-correction.tsx').write_text('''import { useEffect, useMemo, useState } from "react";\nimport { GAME_SCORE_ABS_MAX, type Game, type PlayerId } from "../domain";\nimport { Button } from "./ui";\n\ninterface Props {\n  readonly game: Game;\n  readonly participantPlayerIds: readonly PlayerId[];\n  readonly playerNameById: (id:string)=>string;\n  readonly disabled: boolean;\n  readonly onCancel: ()=>void;\n  readonly onBusyChange: (busy:boolean)=>void;\n  readonly onError: (message:string|null)=>void;\n  readonly onSaved: ()=>Promise<void>|void;\n}\n\nexport function FinalizedGameCorrection({game,participantPlayerIds,playerNameById,disabled,onCancel,onBusyChange,onError,onSaved}:Props){\n  const initial=useMemo(()=>Object.fromEntries(game.results.map(result=>[result.playerId,String(result.scorePoint)])),[game]);\n  const [inputs,setInputs]=useState<Record<string,string>>(initial);\n  useEffect(()=>setInputs(initial),[initial]);\n  const parsed=participantPlayerIds.map(playerId=>{const raw=inputs[playerId]?.trim()??"";const value=/^-?\\d+$/.test(raw)?Number(raw):null;return {playerId,raw,value};});\n  const valid=parsed.length>=3&&parsed.every(item=>item.value!==null&&Math.abs(item.value)<=GAME_SCORE_ABS_MAX)&&parsed.reduce((sum,item)=>sum+(item.value??0),0)===0;\n  const changed=game.results.some(result=>inputs[result.playerId]?.trim()!==String(result.scorePoint));\n  const total=parsed.reduce((sum,item)=>sum+(item.value??0),0);\n\n  const save=async()=>{\n    if(!valid||!changed||disabled)return;\n    if(!window.confirm("確定済みの過去データを修正します。成績集計にも反映されます。続けますか？"))return;\n    onBusyChange(true);onError(null);\n    try{\n      const corrected=new Map(parsed.map(item=>[item.playerId,item.value as number]));\n      const response=await fetch(`/api/games/${encodeURIComponent(game.id)}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({...game,expectedVersion:game.version,results:game.results.map(result=>({...result,scorePoint:corrected.get(result.playerId)??result.scorePoint})),tags:game.tags})});\n      if(!response.ok){\n        const payload=await response.json().catch(()=>null) as {error?:{code?:string;message?:string}}|null;\n        if(response.status===403)onError("確定済み結果の修正はシステム管理者のみ実行できます。");\n        else if(payload?.error?.code==="stale_update")onError("他の端末で結果が更新されました。最新状態を確認して再操作してください。");\n        else onError(payload?.error?.message??"半荘結果を修正できませんでした。");\n        return;\n      }\n      await onSaved();\n    }catch{onError("半荘結果を修正できませんでした。");}\n    finally{onBusyChange(false);}\n  };\n\n  return <section className="settlement" aria-label={`${game.sequence}半荘目の結果修正`}>\n    <h2>{game.sequence}半荘目の結果修正</h2>\n    <p className="score-sheet__hint">確定済みの過去データです。システム管理者だけが訂正できます。</p>\n    <div className={"score-sheet score-sheet--"+participantPlayerIds.length}>\n      <div className="score-sheet__corner">訂正</div>{participantPlayerIds.map(id=><div className="score-sheet__player" key={"correction-head-"+id}>{playerNameById(id)}</div>)}\n      <div className="score-sheet__row score-sheet__row--input"><div className="score-sheet__label">pt</div>{participantPlayerIds.map(id=><div className="score-sheet__input-cell" key={id}><input aria-label={playerNameById(id)+"の訂正ポイント"} inputMode="numeric" value={inputs[id]??""} onChange={event=>setInputs(current=>({...current,[id]:event.target.value.replace(/[^0-9-]/g,"")}))}/></div>)}</div>\n    </div>\n    <p className="score-sheet__hint">合計: {total}pt（0ptになるように入力してください）</p>\n    <div className="edit-actions"><Button block disabled={disabled||!valid||!changed} onClick={()=>void save()}>確定済み結果を修正</Button><Button block variant="quiet" disabled={disabled} onClick={onCancel}>キャンセル</Button></div>\n  </section>;\n}\n''')

          # App wiring: System Admin only.
          replace_once('src/App.tsx',
          'import { SessionMemoEditor } from "./components/session-memo-editor";\n',
          'import { SessionMemoEditor } from "./components/session-memo-editor";\nimport { FinalizedGameCorrection } from "./components/finalized-game-correction";\n')
          replace_once('src/App.tsx',
          '  const [gamePendingDelete,setGamePendingDelete]=useState<Game|null>(null);\n',
          '  const [gamePendingDelete,setGamePendingDelete]=useState<Game|null>(null);\n  const [historyEditingGameId,setHistoryEditingGameId]=useState<string|null>(null);\n')
          replace_once('src/App.tsx',
          '  const openHistoryResult=async(id:string)=>{setResultsBackView("history");setIsBusy(true);setErrorMessage(null);',
          '  const openHistoryResult=async(id:string)=>{setResultsBackView("history");setHistoryEditingGameId(null);setIsBusy(true);setErrorMessage(null);')
          replace_once('src/App.tsx',
          '''{sessionResults.games.map(g=><div className="score-sheet__row" key={g.id}><div className="score-sheet__label">{g.sequence}</div>{ids.map(id=><div className={`score-sheet__value ${numberClass(g.results.find(r=>r.playerId===id)?.scorePoint??0)}`} key={id}>{formatScore(g.results.find(r=>r.playerId===id)?.scorePoint??0)}</div>)}</div>)}''',
          '''{sessionResults.games.map(g=><div className="score-sheet__row" key={g.id}><div className={resultsBackView==="history"&&appAuth?.user.systemRole==="admin"?"score-sheet__label score-sheet__label--actions":"score-sheet__label"}><span>{g.sequence}</span>{resultsBackView==="history"&&appAuth?.user.systemRole==="admin"?<button className="icon-action" type="button" aria-label={`${g.sequence}半荘目の結果を修正`} title="結果を修正" onClick={()=>setHistoryEditingGameId(g.id)}><svg className="edit-pencil-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4.2L19 9.2 14.8 5 4 15.8V20Z"/><path d="m13.7 6.1 4.2 4.2"/><path d="M4 20h16"/></svg></button>:null}</div>{ids.map(id=><div className={`score-sheet__value ${numberClass(g.results.find(r=>r.playerId===id)?.scorePoint??0)}`} key={id}>{formatScore(g.results.find(r=>r.playerId===id)?.scorePoint??0)}</div>)}</div>)}''')
          replace_once('src/App.tsx',
          '''</div><div className={"score-sheet score-sheet--"+ids.length}><div className="score-sheet__corner">名前</div>''',
          '''</div>{resultsBackView==="history"&&appAuth?.user.systemRole==="admin"&&historyEditingGameId?<FinalizedGameCorrection game={sessionResults.games.find(game=>game.id===historyEditingGameId)!} participantPlayerIds={ids} playerNameById={playerNameById} disabled={isBusy} onCancel={()=>setHistoryEditingGameId(null)} onBusyChange={setIsBusy} onError={setErrorMessage} onSaved={async()=>{const refreshed=await services.getSessionResults.execute(sessionResults.session.id);if(!refreshed.ok||!refreshed.value){setErrorMessage(refreshed.ok?"最新のSession結果を読み込めませんでした。":refreshed.error.userMessage??"最新のSession結果を読み込めませんでした。");return;}setSessionResults(refreshed.value);setHistoryEditingGameId(null);setStatusMessage("半荘結果を修正しました。");}}/>:null}<div className={"score-sheet score-sheet--"+ids.length}><div className="score-sheet__corner">名前</div>''')

          # Regression contract tests. Full behavioral validation remains in Worker/API + build pipeline.
          Path('tests/finalized-game-correction-contract.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst worker=readFileSync("src/worker.ts","utf8");\nconst app=readFileSync("src/App.tsx","utf8");\nconst component=readFileSync("src/components/finalized-game-correction.tsx","utf8");\n\ntest("finalized Game correction is restricted to System Admin",()=>{\n  assert.match(worker,/correctingFinalized&&!await isSystemAdmin\(env,authUserId\)/);\n  assert.match(worker,/System admin role required to correct finalized Game/);\n  assert.match(app,/resultsBackView==="history"&&appAuth\?\.user\.systemRole==="admin"/);\n});\n\ntest("finalized correction keeps version guard, placement recalculation and audit",()=>{\n  assert.match(worker,/deriveGameResultPlacements/);\n  assert.match(worker,/writableStatus=correctingFinalized\?"finalized":"active"/);\n  assert.match(worker,/finalized_game_corrected/);\n  assert.match(worker,/version=version\+1/);\n});\n\ntest("correction UI preserves existing tags and requires explicit confirmation",()=>{\n  assert.match(component,/tags:game\.tags/);\n  assert.match(component,/window\.confirm\("確定済みの過去データを修正します/);\n  assert.match(component,/parsed\.reduce\(\(sum,item\)=>sum\+\(item\.value\?\?0\),0\)===0/);\n});\n''')
          PY

          git add src docs tests
          git commit -m "feat: allow System Admin to correct finalized Game results"

      - name: Validate implementation
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build

      - name: Push implementation
        run: git push origin HEAD:feature/303-admin-finalized-game-correction
