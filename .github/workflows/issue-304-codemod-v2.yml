name: Issue 304 scoped codemod v2

on:
  push:
    branches:
      - feature/304-session-win-rate-placement
    paths:
      - '.github/workflows/issue-304-codemod-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/304-session-win-rate-placement
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Apply design and implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]}')
              p.write_text(text.replace(old,new))

          replace_once('docs/09_FUNCTION_DESIGN.md','- `GameResult = { playerId, scorePoint }`','- `GameResult = { playerId, scorePoint, placement?, isLast? }`。D1から読み出した保存済みGameでは`placement` / `isLast`を返し、未保存入力やlegacy local dataでは互換のため省略可能とする')
          replace_once('docs/09_FUNCTION_DESIGN.md','- 勝率は `そのGameで最高scorePointになった回数 ÷ Session内のGame数 × 100` とし、小数1桁で表示する\n- 現行D1では1位同点をvalid writeとして許可しない。Session Resultsの既存read helperはlegacy/defensive readとして同点最高を複数1位扱いできるが、新規/訂正データでは発生しない','- 勝率は `保存済みGameResult.placement = 1 の回数 ÷ Session内のGame数 × 100` とし、小数1桁で表示する\n- Session ResultsはScore Point最大値から1位を再推定しない。D1に保存済みの`placement`をread modelの正本として使う\n- `GET /api/sessions/:sessionId/games` と `GET /api/games/:gameId` は`placement` / `isLast`を返す')
          replace_once('docs/12_INTERFACE_IO_DESIGN.md','Game read payloadはIssue #299では既存shapeを維持し、`placement` / `isLast`を追加しない。Performance集計はserver-sideでD1列を利用する。','Issue #304以降、Game read payloadは保存済み`game_results.placement` / `is_last`をそれぞれ`placement` / `isLast`として返す。対象は`GET /api/sessions/:sessionId/games`と`GET /api/games/:gameId`。`isLast`はbooleanへ正規化する。Session Resultsの勝率はこの`placement`を正本として使い、Score Point最大値から順位を再推定しない。Performance集計は引き続きserver-sideでD1列を利用する。')

          replace_once('src/domain/models.ts','''export interface GameResult {\n  readonly playerId: PlayerId;\n  readonly scorePoint: number;\n}''','''export interface GameResult {\n  readonly playerId: PlayerId;\n  readonly scorePoint: number;\n  readonly placement?: number;\n  readonly isLast?: boolean;\n}''')
          replace_once('src/application/use-cases/session-result-metrics.ts','''  for (const game of games) {\n    const bestScore = Math.max(...game.results.map((result) => result.scorePoint));\n    for (const result of game.results) {\n      if (!totals.has(result.playerId)) continue;\n      totals.set(result.playerId, (totals.get(result.playerId) ?? 0) + result.scorePoint);\n      if (result.scorePoint === bestScore) {\n        firstPlaces.set(result.playerId, (firstPlaces.get(result.playerId) ?? 0) + 1);\n      }\n    }\n  }''','''  for (const game of games) {\n    for (const result of game.results) {\n      if (!totals.has(result.playerId)) continue;\n      totals.set(result.playerId, (totals.get(result.playerId) ?? 0) + result.scorePoint);\n      if (result.placement === 1) {\n        firstPlaces.set(result.playerId, (firstPlaces.get(result.playerId) ?? 0) + 1);\n      }\n    }\n  }''')

          worker=Path('src/worker.ts'); text=worker.read_text()
          reps=[
            ('SELECT player_id AS playerId,score_point AS scorePoint FROM game_results WHERE game_id=? ORDER BY rank','SELECT player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id=? ORDER BY rank'),
            ('return json({game:{...game,results:rr.results,tags:tt.results}});','return json({game:{...game,results:(rr.results as Array<Record<string,unknown>>).map(r=>({playerId:r.playerId,scorePoint:r.scorePoint,placement:r.placement,isLast:Boolean(r.isLast)})),tags:tt.results}});'),
            ('SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint FROM game_results WHERE game_id IN (${placeholders}) ORDER BY game_id,rank','SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id IN (${placeholders}) ORDER BY game_id,rank'),
            ('const resultsByGame=new Map<string,Array<{playerId:unknown;scorePoint:unknown}>>()','const resultsByGame=new Map<string,Array<{playerId:unknown;scorePoint:unknown;placement:unknown;isLast:boolean}>>()'),
            ('items.push({playerId:r.playerId,scorePoint:r.scorePoint});resultsByGame.set(id,items);','items.push({playerId:r.playerId,scorePoint:r.scorePoint,placement:r.placement,isLast:Boolean(r.isLast)});resultsByGame.set(id,items);')]
          for old,new in reps:
              c=text.count(old)
              if c!=1: raise SystemExit(f'src/worker.ts anchor count {c}: {old[:80]}')
              text=text.replace(old,new)
          worker.write_text(text)

          Path('tests/session-result-metrics.test.ts').write_text('''import { strict as assert } from "node:assert";\nimport { test } from "node:test";\nimport { calculateSessionResultMetrics } from "../src/application/use-cases/session-result-metrics";\nimport type { Game } from "../src/domain";\n\nconst game = (sequence: number, scores: readonly number[], placements: readonly number[], lastPlayerIndexes: readonly number[] = []): Game => ({\n  id: `game-${sequence}`, sessionId: "session-1", segmentId: "segment-1", sequence,\n  playedAt: `2026-09-30T${String(sequence).padStart(2, "0")}:00:00.000Z`,\n  results: scores.map((scorePoint, index) => ({ playerId: `p${index + 1}`, scorePoint, placement: placements[index], isLast: lastPlayerIndexes.includes(index) })), tags: [],\n});\n\ntest("calculates Session average score and win rate from persisted placement", () => {\n  const games: readonly Game[] = [game(1,[24,-14,-10],[1,3,2],[1]),game(2,[53,-28,-25],[1,3,2],[1]),game(3,[-38,-4,42],[3,2,1],[0]),game(4,[66,-46,-20],[1,3,2],[1]),game(5,[54,-51,-3],[1,3,2],[1]),game(6,[14,-45,31],[2,3,1],[1])];\n  const metrics=calculateSessionResultMetrics(["p1","p2","p3"],games);\n  assert.deepEqual(metrics.map(m=>m.scorePointTotal),[173,-188,15]);\n  assert.deepEqual(metrics.map(m=>Number(m.averageScorePoint.toFixed(1))),[28.8,-31.3,2.5]);\n  assert.deepEqual(metrics.map(m=>m.firstPlaceCount),[4,0,2]);\n  assert.deepEqual(metrics.map(m=>Number(m.winRate.toFixed(1))),[66.7,0,33.3]);\n});\n\ntest("does not infer multiple winners from a tied highest score",()=>{const metrics=calculateSessionResultMetrics(["p1","p2","p3"],[game(1,[10,10,-20],[1,2,3],[2])]);assert.deepEqual(metrics.map(m=>m.firstPlaceCount),[1,0,0]);assert.deepEqual(metrics.map(m=>m.winRate),[100,0,0]);});\ntest("supports lower-place ties in three- and four-player stored placements",()=>{const a=calculateSessionResultMetrics(["p1","p2","p3"],[game(1,[50,-25,-25],[1,2,2],[1,2])]);const b=calculateSessionResultMetrics(["p1","p2","p3","p4"],[game(2,[50,10,-30,-30],[1,2,3,3],[2,3])]);assert.deepEqual(a.map(m=>m.firstPlaceCount),[1,0,0]);assert.deepEqual(b.map(m=>m.firstPlaceCount),[1,0,0,0]);});\ntest("does not fall back to scorePoint when legacy result has no placement",()=>{const legacy:Game={...game(1,[30,-10,-20],[1,2,3],[2]),results:[{playerId:"p1",scorePoint:30},{playerId:"p2",scorePoint:-10},{playerId:"p3",scorePoint:-20}]};const metrics=calculateSessionResultMetrics(["p1","p2","p3"],[legacy]);assert.deepEqual(metrics.map(m=>m.firstPlaceCount),[0,0,0]);});\ntest("returns zero metrics for an empty Session defensively",()=>{const metrics=calculateSessionResultMetrics(["p1","p2","p3"],[]);assert.deepEqual(metrics.map(m=>({average:m.averageScorePoint,wins:m.firstPlaceCount,winRate:m.winRate})),[{average:0,wins:0,winRate:0},{average:0,wins:0,winRate:0},{average:0,wins:0,winRate:0}]);});\n''')
          Path('tests/game-read-placement-contract.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\nconst worker=readFileSync("src/worker.ts","utf8");\ntest("Game read APIs expose persisted placement and boolean isLast",()=>{assert.match(worker,/SELECT player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id=\\?/);assert.match(worker,/SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id IN/);assert.match(worker,/placement:r\\.placement,isLast:Boolean\\(r\\.isLast\\)/);});\n''')

          replace_once('tests/worker-api-security.test.ts','private gameResults:Record<string,Array<{playerId:string;scorePoint:number}>>={},','private gameResults:Record<string,Array<{playerId:string;scorePoint:number;placement?:number;isLast?:number}>>={},')
          replace_once('tests/worker-api-security.test.ts','''      game1:[{playerId:"p1",scorePoint:10},{playerId:"p2",scorePoint:-5},{playerId:"p3",scorePoint:-5}],\n      game2:[{playerId:"p1",scorePoint:-8},{playerId:"p2",scorePoint:3},{playerId:"p3",scorePoint:5}],''','''      game1:[{playerId:"p1",scorePoint:10,placement:1,isLast:0},{playerId:"p2",scorePoint:-5,placement:2,isLast:1},{playerId:"p3",scorePoint:-5,placement:2,isLast:1}],\n      game2:[{playerId:"p1",scorePoint:-8,placement:3,isLast:1},{playerId:"p2",scorePoint:3,placement:2,isLast:0},{playerId:"p3",scorePoint:5,placement:1,isLast:0}],''')
          replace_once('tests/worker-api-security.test.ts','const payload=await response.json() as {games:Array<{id:string;results:Array<{playerId:string;scorePoint:number}>;tags:Array<{type:string;playerId:string|null}>}>};','const payload=await response.json() as {games:Array<{id:string;results:Array<{playerId:string;scorePoint:number;placement:number;isLast:boolean}>;tags:Array<{type:string;playerId:string|null}>}>};')
          replace_once('tests/worker-api-security.test.ts','assert.deepEqual(payload.games[0]?.results,[{playerId:"p1",scorePoint:10},{playerId:"p2",scorePoint:-5},{playerId:"p3",scorePoint:-5}]);','assert.deepEqual(payload.games[0]?.results,[{playerId:"p1",scorePoint:10,placement:1,isLast:false},{playerId:"p2",scorePoint:-5,placement:2,isLast:true},{playerId:"p3",scorePoint:-5,placement:2,isLast:true}]);')
          replace_once('tests/worker-api-security.test.ts','assert.deepEqual(payload.games[1]?.results,[{playerId:"p1",scorePoint:-8},{playerId:"p2",scorePoint:3},{playerId:"p3",scorePoint:5}]);','assert.deepEqual(payload.games[1]?.results,[{playerId:"p1",scorePoint:-8,placement:3,isLast:true},{playerId:"p2",scorePoint:3,placement:2,isLast:false},{playerId:"p3",scorePoint:5,placement:1,isLast:false}]);')
          PY
          git add docs/09_FUNCTION_DESIGN.md docs/12_INTERFACE_IO_DESIGN.md src/domain/models.ts src/application/use-cases/session-result-metrics.ts src/worker.ts tests/session-result-metrics.test.ts tests/game-read-placement-contract.test.ts tests/worker-api-security.test.ts
          git commit -m "fix: use persisted placement for Session win rate"
      - name: Validate implementation
        run: |
          npm install
          npm run lint
          npm test
          npm run build
      - name: Push implementation
        run: git push origin HEAD:feature/304-session-win-rate-placement
