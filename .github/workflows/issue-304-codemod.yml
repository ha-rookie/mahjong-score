name: Issue 304 scoped codemod

on:
  push:
    branches:
      - feature/304-session-win-rate-placement
    paths:
      - '.github/workflows/issue-304-codemod.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/304-session-win-rate-placement
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Update design before implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old,new))

          replace_once('docs/09_FUNCTION_DESIGN.md',
          '- `GameResult = { playerId, scorePoint }`',
          '- `GameResult = { playerId, scorePoint, placement?, isLast? }`。D1から読み出した保存済みGameでは`placement` / `isLast`を返し、未保存入力やlegacy local dataでは互換のため省略可能とする')

          replace_once('docs/09_FUNCTION_DESIGN.md',
          '- 勝率は `そのGameで最高scorePointになった回数 ÷ Session内のGame数 × 100` とし、小数1桁で表示する\n- 現行D1では1位同点をvalid writeとして許可しない。Session Resultsの既存read helperはlegacy/defensive readとして同点最高を複数1位扱いできるが、新規/訂正データでは発生しない',
          '- 勝率は `保存済みGameResult.placement = 1 の回数 ÷ Session内のGame数 × 100` とし、小数1桁で表示する\n- Session ResultsはScore Point最大値から1位を再推定しない。D1に保存済みの`placement`をread modelの正本として使う\n- `GET /api/sessions/:sessionId/games` と `GET /api/games/:gameId` は`placement` / `isLast`を返す')

          replace_once('docs/12_INTERFACE_IO_DESIGN.md',
          'Game read payloadはIssue #299では既存shapeを維持し、`placement` / `isLast`を追加しない。Performance集計はserver-sideでD1列を利用する。',
          'Issue #304以降、Game read payloadは保存済み`game_results.placement` / `is_last`をそれぞれ`placement` / `isLast`として返す。対象は`GET /api/sessions/:sessionId/games`と`GET /api/games/:gameId`。`isLast`はbooleanへ正規化する。Session Resultsの勝率はこの`placement`を正本として使い、Score Point最大値から順位を再推定しない。Performance集計は引き続きserver-sideでD1列を利用する。')

          PY
          git add docs/09_FUNCTION_DESIGN.md docs/12_INTERFACE_IO_DESIGN.md
          git commit -m "docs: make persisted placement authoritative for Session win rate"

      - name: Implement placement-based Session win rate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old,new))

          replace_once('src/domain/models.ts',
          '''export interface GameResult {\n  readonly playerId: PlayerId;\n  readonly scorePoint: number;\n}''',
          '''export interface GameResult {\n  readonly playerId: PlayerId;\n  readonly scorePoint: number;\n  readonly placement?: number;\n  readonly isLast?: boolean;\n}''')

          replace_once('src/application/use-cases/session-result-metrics.ts',
          '''  for (const game of games) {\n    const bestScore = Math.max(...game.results.map((result) => result.scorePoint));\n    for (const result of game.results) {\n      if (!totals.has(result.playerId)) continue;\n      totals.set(result.playerId, (totals.get(result.playerId) ?? 0) + result.scorePoint);\n      if (result.scorePoint === bestScore) {\n        firstPlaces.set(result.playerId, (firstPlaces.get(result.playerId) ?? 0) + 1);\n      }\n    }\n  }''',
          '''  for (const game of games) {\n    for (const result of game.results) {\n      if (!totals.has(result.playerId)) continue;\n      totals.set(result.playerId, (totals.get(result.playerId) ?? 0) + result.scorePoint);\n      if (result.placement === 1) {\n        firstPlaces.set(result.playerId, (firstPlaces.get(result.playerId) ?? 0) + 1);\n      }\n    }\n  }''')

          worker=Path('src/worker.ts')
          text=worker.read_text()
          replacements=[
            (
              'SELECT player_id AS playerId,score_point AS scorePoint FROM game_results WHERE game_id=? ORDER BY rank',
              'SELECT player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id=? ORDER BY rank'
            ),
            (
              'return json({game:{...game,results:rr.results,tags:tt.results}});',
              'return json({game:{...game,results:(rr.results as Array<Record<string,unknown>>).map(r=>({playerId:r.playerId,scorePoint:r.scorePoint,placement:r.placement,isLast:Boolean(r.isLast)})),tags:tt.results}});'
            ),
            (
              'SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint FROM game_results WHERE game_id IN (${placeholders}) ORDER BY game_id,rank',
              'SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id IN (${placeholders}) ORDER BY game_id,rank'
            ),
            (
              'const resultsByGame=new Map<string,Array<{playerId:unknown;scorePoint:unknown}>>()',
              'const resultsByGame=new Map<string,Array<{playerId:unknown;scorePoint:unknown;placement:unknown;isLast:boolean}>>()'
            ),
            (
              'items.push({playerId:r.playerId,scorePoint:r.scorePoint});resultsByGame.set(id,items);',
              'items.push({playerId:r.playerId,scorePoint:r.scorePoint,placement:r.placement,isLast:Boolean(r.isLast)});resultsByGame.set(id,items);'
            ),
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'src/worker.ts: expected one anchor for {old[:55]!r}, found {count}')
              text=text.replace(old,new)
          worker.write_text(text)

          Path('tests/session-result-metrics.test.ts').write_text('''import { strict as assert } from "node:assert";\nimport { test } from "node:test";\nimport { calculateSessionResultMetrics } from "../src/application/use-cases/session-result-metrics";\nimport type { Game } from "../src/domain";\n\nconst game = (\n  sequence: number,\n  scores: readonly number[],\n  placements: readonly number[],\n  lastPlayerIndexes: readonly number[] = [],\n): Game => ({\n  id: `game-${sequence}`,\n  sessionId: "session-1",\n  segmentId: "segment-1",\n  sequence,\n  playedAt: `2026-09-30T${String(sequence).padStart(2, "0")}:00:00.000Z`,\n  results: scores.map((scorePoint, index) => ({\n    playerId: `p${index + 1}`,\n    scorePoint,\n    placement: placements[index],\n    isLast: lastPlayerIndexes.includes(index),\n  })),\n  tags: [],\n});\n\ntest("calculates Session average score and win rate from persisted placement", () => {\n  const games: readonly Game[] = [\n    game(1, [24, -14, -10], [1, 3, 2], [1]),\n    game(2, [53, -28, -25], [1, 3, 2], [1]),\n    game(3, [-38, -4, 42], [3, 2, 1], [0]),\n    game(4, [66, -46, -20], [1, 3, 2], [1]),\n    game(5, [54, -51, -3], [1, 3, 2], [1]),\n    game(6, [14, -45, 31], [2, 3, 1], [1]),\n  ];\n\n  const metrics = calculateSessionResultMetrics(["p1", "p2", "p3"], games);\n\n  assert.deepEqual(metrics.map((metric) => metric.scorePointTotal), [173, -188, 15]);\n  assert.deepEqual(metrics.map((metric) => Number(metric.averageScorePoint.toFixed(1))), [28.8, -31.3, 2.5]);\n  assert.deepEqual(metrics.map((metric) => metric.firstPlaceCount), [4, 0, 2]);\n  assert.deepEqual(metrics.map((metric) => Number(metric.winRate.toFixed(1))), [66.7, 0, 33.3]);\n});\n\ntest("does not infer multiple winners from a tied highest score", () => {\n  const stored: Game = game(1, [10, 10, -20], [1, 2, 3], [2]);\n\n  const metrics = calculateSessionResultMetrics(["p1", "p2", "p3"], [stored]);\n\n  assert.deepEqual(metrics.map((metric) => metric.firstPlaceCount), [1, 0, 0]);\n  assert.deepEqual(metrics.map((metric) => metric.winRate), [100, 0, 0]);\n});\n\ntest("supports lower-place ties in three- and four-player stored placements", () => {\n  const three = game(1, [50, -25, -25], [1, 2, 2], [1, 2]);\n  const four = game(2, [50, 10, -30, -30], [1, 2, 3, 3], [2, 3]);\n\n  const threeMetrics = calculateSessionResultMetrics(["p1", "p2", "p3"], [three]);\n  const fourMetrics = calculateSessionResultMetrics(["p1", "p2", "p3", "p4"], [four]);\n\n  assert.deepEqual(threeMetrics.map((metric) => metric.firstPlaceCount), [1, 0, 0]);\n  assert.deepEqual(fourMetrics.map((metric) => metric.firstPlaceCount), [1, 0, 0, 0]);\n});\n\ntest("does not fall back to scorePoint when legacy result has no placement", () => {\n  const legacy: Game = {\n    ...game(1, [30, -10, -20], [1, 2, 3], [2]),\n    results: [\n      { playerId: "p1", scorePoint: 30 },\n      { playerId: "p2", scorePoint: -10 },\n      { playerId: "p3", scorePoint: -20 },\n    ],\n  };\n\n  const metrics = calculateSessionResultMetrics(["p1", "p2", "p3"], [legacy]);\n  assert.deepEqual(metrics.map((metric) => metric.firstPlaceCount), [0, 0, 0]);\n});\n\ntest("returns zero metrics for an empty Session defensively", () => {\n  const metrics = calculateSessionResultMetrics(["p1", "p2", "p3"], []);\n\n  assert.deepEqual(metrics.map((metric) => ({\n    average: metric.averageScorePoint,\n    wins: metric.firstPlaceCount,\n    winRate: metric.winRate,\n  })), [\n    { average: 0, wins: 0, winRate: 0 },\n    { average: 0, wins: 0, winRate: 0 },\n    { average: 0, wins: 0, winRate: 0 },\n  ]);\n});\n''')

          Path('tests/game-read-placement-contract.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\nconst worker=readFileSync("src/worker.ts","utf8");\n\ntest("Game read APIs expose persisted placement and boolean isLast",()=>{\n  assert.match(worker,/SELECT player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id=\\?/);\n  assert.match(worker,/SELECT game_id AS gameId,player_id AS playerId,score_point AS scorePoint,placement,is_last AS isLast FROM game_results WHERE game_id IN/);\n  assert.match(worker,/placement:r\\.placement,isLast:Boolean\\(r\\.isLast\\)/);\n});\n''')

          PY
          git add src/domain/models.ts src/application/use-cases/session-result-metrics.ts src/worker.ts tests/session-result-metrics.test.ts tests/game-read-placement-contract.test.ts
          git commit -m "fix: use persisted placement for Session win rate"

      - name: Validate implementation
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Push implementation
        run: git push origin HEAD:feature/304-session-win-rate-placement
