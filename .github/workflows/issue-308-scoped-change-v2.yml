name: Issue 308 scoped implementation v2

on:
  push:
    branches:
      - feature/308-performance-placement-analytics
    paths:
      - '.github/workflows/issue-308-scoped-change-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/308-performance-placement-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Apply design and implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: anchor count={count}: {old[:80]}')
              p.write_text(text.replace(old,new))

          replace_once('docs/09_FUNCTION_DESIGN.md',
          '  - Session勝率: `sessionFirstPlaceCount / sessionCount × 100`。Session最終pt（chip込み）が最大だった回数を分子とし、`1/2`のように件数も併記\n- `gameFirstPlaceCount`はD1に保存済みの`game_results.placement=1`をaggregateする',
          '  - Session勝率: `sessionFirstPlaceCount / sessionCount × 100`。Session最終pt（chip込み）が最大だった回数を分子とし、`1/2`のように件数も併記\n  - 平均順位: 保存済み`placement`合計 / `gameCount`。小数2桁で表示する\n  - ラス率: 保存済み`is_last=1`件数 / `gameCount × 100`。率と`3/12`のような件数を併記する\n  - 着順分布: 保存済み`placement=1/2/3/4`の件数を表示する\n- 平均順位は保存済み競技順位の単純平均とし、下位同点をmid-rankへ変換しない。例: `1,2,2`の同点Playerはそれぞれ`2`として扱う\n- ラスは`placement`最大値から推定せず、`is_last`を正本とする。`1,2,2`で同点2名が最下位なら両名をラスとして数える\n- `gameFirstPlaceCount`はD1に保存済みの`game_results.placement=1`をaggregateする')
          replace_once('docs/09_FUNCTION_DESIGN.md',
          '- 平均/勝率の率そのものはD1へ保存しない。分子・分母のraw aggregateからUIで算出する\n- Performance APIは1回のaggregate queryで返し、Game単位の追加N+1 queryを発生させない',
          '- 平均Score Point / 平均順位 / 勝率 / ラス率そのものはD1へ保存しない。分子・分母のraw aggregateからUIで算出する\n- Performance APIは1回のaggregate queryで返し、Game単位の追加N+1 queryを発生させない')
          replace_once('docs/10_SCREEN_DESIGN.md',
          '### PERFORMANCE\n- Homeに「通算成績を見る」を配置する\n- Playerごとに最終pt、麻雀pt、1位回数、Session数、半荘数を表示する\n- 最終pt降順で表示する',
          '### PERFORMANCE\n- Homeに「通算成績を見る」を配置する\n- Playerごとに最終pt、麻雀pt、平均pt、半荘勝率、Session勝率、平均順位、ラス率、1位/2位/3位/4位回数を表示する\n- 平均順位は保存済み`placement`の単純平均を小数2桁で表示し、同順位をmid-rankへ変換しない\n- ラス率は保存済み`isLast`を正本とし、率とラス回数/半荘数を併記する\n- 着順分布は1位/2位/3位/4位の回数をコンパクトに表示する。3人Gameでは4位0回を許容する\n- 320px以上で横スクロールを増やさず、既存Performance card内の補助行として追加する\n- 最終pt降順で表示する')
          replace_once('docs/12_INTERFACE_IO_DESIGN.md',
          '  "finalPointTotal": 631,\n  "gameFirstPlaceCount": 28,\n  "sessionFirstPlaceCount": 5',
          '  "finalPointTotal": 631,\n  "placementTotal": 142,\n  "gameFirstPlaceCount": 28,\n  "secondPlaceCount": 24,\n  "thirdPlaceCount": 20,\n  "fourthPlaceCount": 0,\n  "lastPlaceCount": 20,\n  "sessionFirstPlaceCount": 5')
          replace_once('docs/12_INTERFACE_IO_DESIGN.md',
          '- `gameFirstPlaceCount`: `game_results.placement = 1`件数\n- `sessionFirstPlaceCount`: Session finalPoint最大だったSession件数。Session finalPoint同点は双方を1位として数える',
          '- `placementTotal`: 保存済み`game_results.placement`の合計。平均順位の分子\n- `gameFirstPlaceCount`: `game_results.placement = 1`件数\n- `secondPlaceCount`: `game_results.placement = 2`件数\n- `thirdPlaceCount`: `game_results.placement = 3`件数\n- `fourthPlaceCount`: `game_results.placement = 4`件数\n- `lastPlaceCount`: `game_results.is_last = 1`件数。最下位同点は各Playerを1件として数える\n- `sessionFirstPlaceCount`: Session finalPoint最大だったSession件数。Session finalPoint同点は双方を1位として数える')
          replace_once('docs/12_INTERFACE_IO_DESIGN.md',
          '- 平均 = `mahjongPointTotal / gameCount`\n- 半荘勝率 = `gameFirstPlaceCount / gameCount * 100`\n- Session勝率 = `sessionFirstPlaceCount / sessionCount * 100`\n\n平均/率そのものはAPI/D1へ保存しない。Performance summaryは1回のaggregate queryで返し、GameごとのN+1 readを行わない。',
          '- 平均pt = `mahjongPointTotal / gameCount`\n- 半荘勝率 = `gameFirstPlaceCount / gameCount * 100`\n- Session勝率 = `sessionFirstPlaceCount / sessionCount * 100`\n- 平均順位 = `placementTotal / gameCount`。保存済み競技順位を単純平均し、同順位をmid-rankへ変換しない\n- ラス率 = `lastPlaceCount / gameCount * 100`。`placement`最大値ではなく`is_last`を使用する\n- 着順分布 = `gameFirstPlaceCount / secondPlaceCount / thirdPlaceCount / fourthPlaceCount`\n\n平均/率そのものはAPI/D1へ保存しない。Performance summaryは1回のaggregate queryで返し、GameごとのN+1 readを行わない。')
          PY
          git add docs/09_FUNCTION_DESIGN.md docs/10_SCREEN_DESIGN.md docs/12_INTERFACE_IO_DESIGN.md
          git commit -m "docs: define performance placement analytics"

          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: anchor count={count}: {old[:80]}')
              p.write_text(text.replace(old,new))

          replace_once('src/application/use-cases/read-models.ts','  readonly finalPointTotal: number;\n  readonly gameFirstPlaceCount: number;\n  readonly sessionFirstPlaceCount: number;','  readonly finalPointTotal: number;\n  readonly placementTotal: number;\n  readonly gameFirstPlaceCount: number;\n  readonly secondPlaceCount: number;\n  readonly thirdPlaceCount: number;\n  readonly fourthPlaceCount: number;\n  readonly lastPlaceCount: number;\n  readonly sessionFirstPlaceCount: number;')
          replace_once('src/worker.ts','COUNT(*) AS gameCount,SUM(gr.score_point) AS mahjongPointTotal,SUM(CASE WHEN gr.placement=1 THEN 1 ELSE 0 END) AS gameFirstPlaceCount','COUNT(*) AS gameCount,SUM(gr.score_point) AS mahjongPointTotal,SUM(gr.placement) AS placementTotal,SUM(CASE WHEN gr.placement=1 THEN 1 ELSE 0 END) AS gameFirstPlaceCount,SUM(CASE WHEN gr.placement=2 THEN 1 ELSE 0 END) AS secondPlaceCount,SUM(CASE WHEN gr.placement=3 THEN 1 ELSE 0 END) AS thirdPlaceCount,SUM(CASE WHEN gr.placement=4 THEN 1 ELSE 0 END) AS fourthPlaceCount,SUM(CASE WHEN gr.is_last=1 THEN 1 ELSE 0 END) AS lastPlaceCount')
          replace_once('src/worker.ts','COALESCE(gs.gameCount,0) AS gameCount,COALESCE(gs.mahjongPointTotal,0) AS mahjongPointTotal,COALESCE(gs.gameFirstPlaceCount,0) AS gameFirstPlaceCount,COALESCE(cr.chip_count,0) AS chipCount','COALESCE(gs.gameCount,0) AS gameCount,COALESCE(gs.mahjongPointTotal,0) AS mahjongPointTotal,COALESCE(gs.placementTotal,0) AS placementTotal,COALESCE(gs.gameFirstPlaceCount,0) AS gameFirstPlaceCount,COALESCE(gs.secondPlaceCount,0) AS secondPlaceCount,COALESCE(gs.thirdPlaceCount,0) AS thirdPlaceCount,COALESCE(gs.fourthPlaceCount,0) AS fourthPlaceCount,COALESCE(gs.lastPlaceCount,0) AS lastPlaceCount,COALESCE(cr.chip_count,0) AS chipCount')
          replace_once('src/worker.ts','SUM(mahjongPointTotal) AS mahjongPointTotal,SUM(finalPoint) AS finalPointTotal,SUM(gameFirstPlaceCount) AS gameFirstPlaceCount,SUM(CASE WHEN finalPoint=best THEN 1 ELSE 0 END) AS sessionFirstPlaceCount','SUM(mahjongPointTotal) AS mahjongPointTotal,SUM(finalPoint) AS finalPointTotal,SUM(placementTotal) AS placementTotal,SUM(gameFirstPlaceCount) AS gameFirstPlaceCount,SUM(secondPlaceCount) AS secondPlaceCount,SUM(thirdPlaceCount) AS thirdPlaceCount,SUM(fourthPlaceCount) AS fourthPlaceCount,SUM(lastPlaceCount) AS lastPlaceCount,SUM(CASE WHEN finalPoint=best THEN 1 ELSE 0 END) AS sessionFirstPlaceCount')
          replace_once('src/App.tsx','const average=a.gameCount===0?0:a.mahjongPointTotal/a.gameCount;const gameWinRate=a.gameCount===0?0:a.gameFirstPlaceCount/a.gameCount*100;const sessionWinRate=a.sessionCount===0?0:a.sessionFirstPlaceCount/a.sessionCount*100;return <article','const average=a.gameCount===0?0:a.mahjongPointTotal/a.gameCount;const gameWinRate=a.gameCount===0?0:a.gameFirstPlaceCount/a.gameCount*100;const sessionWinRate=a.sessionCount===0?0:a.sessionFirstPlaceCount/a.sessionCount*100;const averagePlacement=a.gameCount===0?0:a.placementTotal/a.gameCount;const lastPlaceRate=a.gameCount===0?0:a.lastPlaceCount/a.gameCount*100;return <article')
          replace_once('src/App.tsx','<div className="performance-card__metric"><dt>平均</dt><dd className={numberClass(average)}>{average>0?"+":""}{average.toFixed(1)}</dd></div>','<div className="performance-card__metric"><dt>平均pt</dt><dd className={numberClass(average)}>{average>0?"+":""}{average.toFixed(1)}</dd></div>')
          replace_once('src/App.tsx','<div className="performance-card__metric"><dt>Session勝率</dt><dd>{formatPercent(sessionWinRate)}<small>{a.sessionFirstPlaceCount}/{a.sessionCount}</small></dd></div></dl>','<div className="performance-card__metric"><dt>Session勝率</dt><dd>{formatPercent(sessionWinRate)}<small>{a.sessionFirstPlaceCount}/{a.sessionCount}</small></dd></div><div className="performance-card__metric"><dt>平均順位</dt><dd>{averagePlacement.toFixed(2)}</dd></div><div className="performance-card__metric"><dt>ラス率</dt><dd>{formatPercent(lastPlaceRate)}<small>{a.lastPlaceCount}/{a.gameCount}</small></dd></div><div className="performance-card__placement-distribution"><dt>着順</dt><dd><span>1位 {a.gameFirstPlaceCount}</span><span>2位 {a.secondPlaceCount}</span><span>3位 {a.thirdPlaceCount}</span><span>4位 {a.fourthPlaceCount}</span></dd></div></dl>')
          css=Path('src/performance-metrics.css'); css.write_text(css.read_text()+'\n.performance-card__placement-distribution { grid-column: span 2; }\n.performance-card__placement-distribution dd { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; font-size:.72rem; font-variant-numeric:tabular-nums; }\n.performance-card__placement-distribution span { white-space:nowrap; }\n@media (max-width:380px){.performance-card__placement-distribution dd{font-size:.64rem;gap:2px;}}\n')
          Path('tests/performance-placement-analytics-contract.test.ts').write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\n\ntest("Performance aggregate reads persisted placement and last-place flags in one query",()=>{const worker=readFileSync("src/worker.ts","utf8");for(const fragment of ["SUM(gr.placement) AS placementTotal","SUM(CASE WHEN gr.placement=1 THEN 1 ELSE 0 END) AS gameFirstPlaceCount","SUM(CASE WHEN gr.placement=2 THEN 1 ELSE 0 END) AS secondPlaceCount","SUM(CASE WHEN gr.placement=3 THEN 1 ELSE 0 END) AS thirdPlaceCount","SUM(CASE WHEN gr.placement=4 THEN 1 ELSE 0 END) AS fourthPlaceCount","SUM(CASE WHEN gr.is_last=1 THEN 1 ELSE 0 END) AS lastPlaceCount","SUM(placementTotal) AS placementTotal","SUM(lastPlaceCount) AS lastPlaceCount"])assert.ok(worker.includes(fragment),fragment);});\ntest("Performance UI derives average placement and last-place rate from raw aggregates",()=>{const app=readFileSync("src/App.tsx","utf8");assert.ok(app.includes("averagePlacement=a.gameCount===0?0:a.placementTotal/a.gameCount"));assert.ok(app.includes("lastPlaceRate=a.gameCount===0?0:a.lastPlaceCount/a.gameCount*100"));for(const label of ["平均順位","ラス率","1位 {a.gameFirstPlaceCount}","4位 {a.fourthPlaceCount}"])assert.ok(app.includes(label),label);});\ntest("Performance design preserves stored tie ranks and uses is_last as last-place truth",()=>{const design=readFileSync("docs/09_FUNCTION_DESIGN.md","utf8");assert.ok(design.includes("下位同点をmid-rankへ変換しない"));assert.ok(design.includes("`is_last`を正本とする"));});\n''')
          PY
          git add src/application/use-cases/read-models.ts src/worker.ts src/App.tsx src/performance-metrics.css tests/performance-placement-analytics-contract.test.ts
          git commit -m "feat: add placement analytics to Performance"

      - name: Validate implementation
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Push implementation
        run: git push origin HEAD:feature/308-performance-placement-analytics
