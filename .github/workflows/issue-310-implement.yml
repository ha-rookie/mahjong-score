name: Issue 310 implementation

on:
  push:
    branches:
      - feature/310-player-performance-detail

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/310-player-performance-detail
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch existing files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found: {path}: {old[:120]!r}")
              p.write_text(text.replace(old,new,1))

          read_models=Path("src/application/use-cases/read-models.ts")
          text=read_models.read_text()
          if "export interface PlayerPerformanceDetailAggregate" not in text:
              text=text.rstrip()+"\n\nexport interface PlayerPerformanceDetailAggregate {\n  readonly playerId: PlayerId;\n  readonly sessionCount: number;\n  readonly gameCount: number;\n  readonly mahjongPointTotal: number;\n  readonly chipCountTotal: number;\n  readonly chipPointTotal: number;\n  readonly finalPointTotal: number;\n  readonly placementTotal: number;\n  readonly firstPlaceCount: number;\n  readonly secondPlaceCount: number;\n  readonly thirdPlaceCount: number;\n  readonly fourthPlaceCount: number;\n  readonly lastPlaceCount: number;\n  readonly sessionFirstPlaceCount: number;\n}\n"
              read_models.write_text(text)

          worker_path=Path("src/worker.ts")
          worker=worker_path.read_text()
          if "const playerPerformanceDetail=url.pathname.match" not in worker:
              anchor=' const activeSession=url.pathname.match(/^\\/api\\/groups\\/([^/]+)\\/active-session$/);'
              if anchor not in worker:
                  raise SystemExit("worker activeSession anchor not found")
              route=base64.b64decode("").decode()
              worker_path.write_text(worker.replace(anchor,route+anchor,1))

          replace_once("src/App.tsx",'import { FinalizedGameCorrection } from "./components/finalized-game-correction";','import { FinalizedGameCorrection } from "./components/finalized-game-correction";\nimport { PlayerPerformanceDetail } from "./components/player-performance-detail";')
          replace_once("src/App.tsx",'type View = "home" | "session-setup" | "results" | "history" | "performance" | "members" | "groups" | "rules";','type View = "home" | "session-setup" | "results" | "history" | "performance" | "player-performance" | "members" | "groups" | "rules";')
          replace_once("src/App.tsx",'  const [performance,setPerformance]=useState<readonly PlayerPerformanceAggregate[]>([]);','  const [performance,setPerformance]=useState<readonly PlayerPerformanceAggregate[]>([]);\n  const [performancePlayerId,setPerformancePlayerId]=useState<string|null>(null);')
          replace_once("src/App.tsx",'setAppAuth(null);setIsLoading(false);setGroup(null);setGroups([]);setPlayers([]);setActiveSession(null);setGames([]);setHistory([]);setPerformance([]);','setAppAuth(null);setIsLoading(false);setGroup(null);setGroups([]);setPlayers([]);setActiveSession(null);setGames([]);setHistory([]);setPerformance([]);setPerformancePlayerId(null);')
          replace_once("src/App.tsx",'const switchGroup=async(groupId:string)=>{if(groupId===group?.id)return;setSessionResults(null);setHistory([]);setHistoryGameCounts({});setPerformance([]);setStatusMessage(null);setErrorMessage(null);setView("home");await refresh(groupId);};','const switchGroup=async(groupId:string)=>{if(groupId===group?.id)return;setSessionResults(null);setHistory([]);setHistoryGameCounts({});setPerformance([]);setPerformancePlayerId(null);setStatusMessage(null);setErrorMessage(null);setView("home");await refresh(groupId);};')
          replace_once("src/App.tsx",'const openPerformance=async()=>{setPerformancePeriod("all");await loadPerformance("all");};','const openPerformance=async()=>{setPerformancePlayerId(null);setPerformancePeriod("all");await loadPerformance("all");};')
          replace_once("src/App.tsx",'<article className="performance-card" key={a.playerId}><div><span className="performance-card__rank">{index+1}</span><strong>{playerNameById(a.playerId)}</strong></div><dl>','<article className="performance-card" key={a.playerId}><div><span className="performance-card__rank">{index+1}</span><button className="performance-card__player-link" type="button" onClick={()=>{setPerformancePlayerId(a.playerId);setView("player-performance");}}><strong>{playerNameById(a.playerId)}</strong></button></div><dl>')
          replace_once("src/App.tsx",'      view==="performance"&&group?<section className="session-setup">','      view==="player-performance"&&group&&performancePlayerId?<PlayerPerformanceDetail groupId={group.id} playerId={performancePlayerId} playerName={playerNameById(performancePlayerId)} initialPeriod={performancePeriod} initialYear={performanceYear} initialMonth={performanceMonth} onBack={()=>setView("performance")}/>:\n      view==="performance"&&group?<section className="session-setup">')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue-310-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/worker.ts src/application/use-cases/read-models.ts .github/workflows/issue-310-implement.yml
          git commit -m "feat: connect Player performance detail for #310"
          git push origin HEAD:feature/310-player-performance-detail
