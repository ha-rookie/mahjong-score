name: Fix Issue 310 implementation workflow

on:
  push:
    branches:
      - feature/310-player-performance-detail

permissions:
  contents: write

jobs:
  fix-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/310-player-performance-detail
          fetch-depth: 0

      - name: Align temporary workflow with repository dependency install
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/issue-310-implement.yml')
          text=p.read_text()
          text=text.replace('      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n','      - uses: actions/setup-node@v6\n        with:\n          node-version: 24\n')
          text=text.replace('        run: npm ci\n','        run: npm install --no-audit --no-fund\n')
          p.write_text(text)
          PY

      - name: Commit workflow fix and remove fixer
        shell: bash
        run: |
          rm .github/workflows/issue-310-workflow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue-310-implement.yml .github/workflows/issue-310-workflow-fix.yml
          git commit -m "chore: align issue 310 workflow with repo install"
          git push origin HEAD:feature/310-player-performance-detail
