name: Long-term performance benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/long-term-performance.yml"
      - "scripts/performance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-preview-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to Preview D1
        run: npm run db:migrate:preview

      - name: Generate 5y / 10y performance fixtures
        run: node scripts/performance/generate-long-term-fixture.mjs

      - name: Remove old performance fixtures
        run: npx wrangler d1 execute DB --remote --preview --file=scripts/performance/cleanup-long-term-fixture.sql

      - name: Seed Preview D1
        run: npx wrangler d1 execute DB --remote --preview --file=performance-output/long-term-fixture.sql

      - name: Benchmark Preview D1
        run: node scripts/performance/benchmark-preview-d1.mjs

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f performance-output/summary.md ]; then
            cat performance-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-term-performance-${{ github.run_id }}
          path: |
            performance-output/fixture-meta.json
            performance-output/results.json
            performance-output/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup Preview D1 performance fixtures
        if: always()
        run: npx wrangler d1 execute DB --remote --preview --file=scripts/performance/cleanup-long-term-fixture.sql
