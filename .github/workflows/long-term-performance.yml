name: Long-term performance benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/long-term-performance.yml"
      - "scripts/performance/**"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-local-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to local D1
        run: npm run db:migrate:local

      - name: Generate 5y / 10y performance fixtures
        run: node scripts/performance/generate-long-term-fixture.mjs

      - name: Seed local D1
        run: npx wrangler d1 execute DB --local --file=performance-output/long-term-fixture.sql

      - name: Benchmark local D1
        run: node scripts/performance/benchmark-local-d1.mjs

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f performance-output/summary.md ]; then
            cat performance-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-term-performance-${{ github.run_id }}
          path: |
            performance-output/fixture-meta.json
            performance-output/results.json
            performance-output/summary.md
          if-no-files-found: warn
          retention-days: 30
