name: Apply Issue 195 scoped patch

on:
  push:
    branches:
      - fix/history-delete-stale-195
    paths:
      - ".github/workflows/patch-issue-195.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/history-delete-stale-195
          fetch-depth: 0
      - name: Patch history stale recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.tsx")
          text = path.read_text()

          old_load = '''  const loadHistoryMonth=async(year:number,month:number)=>{if(!group)return;setIsHistoryLoading(true);setErrorMessage(null);try{const params=new URLSearchParams({year:String(year),month:String(month)});const response=await fetch(`/api/groups/${encodeURIComponent(group.id)}/history-summary?${params.toString()}`);if(!response.ok)throw new Error("history");const payload=await response.json() as {sessions:Array<Session&{gameCount:number}>};setHistory(payload.sessions);setHistoryGameCounts(Object.fromEntries(payload.sessions.map(s=>[s.id,s.gameCount])));}catch{setErrorMessage("過去の麻雀を読み込めませんでした。");}setIsHistoryLoading(false);};'''
          new_load = '''  const loadHistoryMonth=async(year:number,month:number):Promise<boolean>=>{if(!group)return false;setIsHistoryLoading(true);setErrorMessage(null);try{const params=new URLSearchParams({year:String(year),month:String(month)});const response=await fetch(`/api/groups/${encodeURIComponent(group.id)}/history-summary?${params.toString()}`);if(!response.ok)throw new Error("history");const payload=await response.json() as {sessions:Array<Session&{gameCount:number}>};setHistory(payload.sessions);setHistoryGameCounts(Object.fromEntries(payload.sessions.map(s=>[s.id,s.gameCount])));setIsHistoryLoading(false);return true;}catch{setErrorMessage("過去の麻雀を読み込めませんでした。");setIsHistoryLoading(false);return false;}};'''

          old_delete = '''  const handleDeleteSession=async(session:Session)=>{if(!group)return;setSessionPendingDelete(null);setIsBusy(true);setErrorMessage(null);const r=await services.deleteSession.execute(session.id);if(!r.ok)setErrorMessage(r.error.userMessage??"Sessionを削除できませんでした。");else{await loadHistoryMonth(historyYear,historyMonth);setStatusMessage(`${session.sessionDate} のSessionを削除しました。`);}setIsBusy(false);};'''
          new_delete = '''  const handleDeleteSession=async(session:Session)=>{if(!group)return;setSessionPendingDelete(null);setIsBusy(true);setErrorMessage(null);const r=await services.deleteSession.execute(session.id);if(!r.ok){if(r.error.code==="stale_update"){const refreshed=await loadHistoryMonth(historyYear,historyMonth);if(refreshed)setErrorMessage("最新状態に更新したので、内容を確認して再操作してください。");}else setErrorMessage(r.error.userMessage??"Sessionを削除できませんでした。");}else{await loadHistoryMonth(historyYear,historyMonth);setStatusMessage(`${session.sessionDate} のSessionを削除しました。`);}setIsBusy(false);};'''

          if old_load not in text:
              raise SystemExit("loadHistoryMonth target not found")
          if old_delete not in text:
              raise SystemExit("handleDeleteSession target not found")

          text = text.replace(old_load, new_load, 1).replace(old_delete, new_delete, 1)
          path.write_text(text)
          PY
      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- src/App.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: refresh history after stale session delete"
          git push origin HEAD:fix/history-delete-stale-195
