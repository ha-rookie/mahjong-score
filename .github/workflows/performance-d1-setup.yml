name: Performance D1 setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-performance-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: performance

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply migrations to Performance D1
        run: npx wrangler d1 migrations apply mahjong-score-performance --remote --config wrangler.performance.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Performance D1 schema
        run: npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
