name: Performance D1 setup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SETUP-PERFORMANCE-D1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-performance-d1:
    if: ${{ inputs.confirmation == 'SETUP-PERFORMANCE-D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: performance

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard migration safety
        run: npm run db:migrations:guard

      - name: Guard Performance D1 target
        shell: bash
        run: |
          set -eu
          grep -q '"database_name": "mahjong-score-performance"' wrangler.performance.jsonc
          grep -q '"database_id": "37b05ca8-9f6e-46b4-92be-7e02513cf044"' wrangler.performance.jsonc
          ! grep -q 'mahjong-score-prod' wrangler.performance.jsonc
          ! grep -q 'mahjong-score-preview' wrangler.performance.jsonc

      - name: Capture Performance D1 gameplay counts before migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "SELECT (SELECT COUNT(*) FROM sessions) AS totalSessions,(SELECT COUNT(*) FROM games) AS totalGames,(SELECT COUNT(*) FROM game_results) AS totalResults,(SELECT COALESCE(SUM(score_point),0) FROM game_results) AS totalScore,(SELECT COUNT(*) FROM sessions WHERE group_id='perf-realistic-5y') AS baseSessions,(SELECT COUNT(*) FROM games g JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS baseGames,(SELECT COUNT(*) FROM game_results r JOIN games g ON g.id=r.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS baseResults;" > /tmp/performance-before.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/performance-before.json','utf8'));
          const row=(Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0];
          if(!row){console.error('Performance D1 count query returned no row');process.exit(1);}
          const baseSessions=Number(row.baseSessions),baseGames=Number(row.baseGames),baseResults=Number(row.baseResults);
          if(baseSessions<260||baseGames<3120||baseResults<9360||baseResults!==baseGames*3){
            console.error('Expected retained 5-year Performance fixture baseline before migration', row);
            process.exit(1);
          }
          console.log('Performance D1 pre-migration counts captured', row);
          NODE

      - name: Normalize legacy deterministic Performance first-place ties
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "WITH maxima AS (SELECT game_id,MAX(score_point) AS max_score FROM game_results GROUP BY game_id),bad AS (SELECT r.game_id,m.max_score,COUNT(*) AS top_count FROM game_results r JOIN maxima m ON m.game_id=r.game_id WHERE r.score_point=m.max_score GROUP BY r.game_id,m.max_score HAVING COUNT(*)>1) SELECT COUNT(*) AS badTotal,SUM(CASE WHEN s.group_id NOT IN ('perf-realistic-5y','perf-realistic-club','perf-realistic-friends') THEN 1 ELSE 0 END) AS badOutsideSynthetic,SUM(CASE WHEN NOT EXISTS (SELECT 1 FROM game_results r1 WHERE r1.game_id=bad.game_id AND r1.rank=1 AND r1.score_point=bad.max_score) THEN 1 ELSE 0 END) AS badRankOne FROM bad JOIN games g ON g.id=bad.game_id JOIN sessions s ON s.id=g.session_id;" > /tmp/performance-tie-precheck.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/performance-tie-precheck.json','utf8'));
          const row=(Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0]??{};
          if(Number(row.badOutsideSynthetic??0)!==0||Number(row.badRankOne??0)!==0){console.error('Refusing to normalize unexpected Performance data',row);process.exit(1);}
          console.log('Legacy Performance first-place ties eligible for deterministic repair',row);
          NODE
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --command "WITH maxima AS (SELECT game_id,MAX(score_point) AS max_score FROM game_results GROUP BY game_id),bad AS (SELECT r.game_id,m.max_score,COUNT(*) AS top_count FROM game_results r JOIN maxima m ON m.game_id=r.game_id WHERE r.score_point=m.max_score GROUP BY r.game_id,m.max_score HAVING COUNT(*)>1),demote AS (SELECT r.game_id,MIN(r.rank) AS demote_rank FROM game_results r JOIN bad b ON b.game_id=r.game_id WHERE r.score_point=b.max_score AND r.rank>1 GROUP BY r.game_id) UPDATE game_results SET score_point=score_point+CASE WHEN rank=1 THEN 1 WHEN rank=(SELECT d.demote_rank FROM demote d WHERE d.game_id=game_results.game_id) THEN -1 ELSE 0 END WHERE game_id IN (SELECT b.game_id FROM bad b JOIN games g ON g.id=b.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id IN ('perf-realistic-5y','perf-realistic-club','perf-realistic-friends'));"
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "WITH maxima AS (SELECT game_id,MAX(score_point) AS max_score FROM game_results GROUP BY game_id),bad AS (SELECT r.game_id FROM game_results r JOIN maxima m ON m.game_id=r.game_id WHERE r.score_point=m.max_score GROUP BY r.game_id HAVING COUNT(*)>1) SELECT (SELECT COUNT(*) FROM bad) AS remainingBad,(SELECT COALESCE(SUM(score_point),0) FROM game_results) AS totalScore;" > /tmp/performance-tie-postcheck.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=(path)=>{const data=JSON.parse(fs.readFileSync(path,'utf8'));return (Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0]??{};};
          const before=rows('/tmp/performance-before.json'),after=rows('/tmp/performance-tie-postcheck.json');
          if(Number(after.remainingBad)!==0||Number(after.totalScore)!==Number(before.totalScore)){console.error('Performance tie normalization invariant failed',{before,after});process.exit(1);}
          console.log('Legacy deterministic Performance first-place ties normalized without changing total score',{beforeTotalScore:before.totalScore,after});
          NODE

      - name: Guard against first-place ties
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "WITH maxima AS (SELECT game_id,MAX(score_point) AS max_score FROM game_results GROUP BY game_id),bad AS (SELECT r.game_id,COUNT(*) AS top_count,GROUP_CONCAT(r.player_id || ':' || r.score_point, ',') AS result_values FROM game_results r JOIN maxima m ON m.game_id=r.game_id WHERE r.score_point=m.max_score GROUP BY r.game_id HAVING COUNT(*)<>1) SELECT game_id,top_count,result_values FROM bad ORDER BY game_id LIMIT 20;" > /tmp/performance-first-ties.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/performance-first-ties.json','utf8'));
          const rows=Array.isArray(data)?data.flatMap(x=>x.results??[]):(data.results??[]);
          if(rows.length){console.error('Performance D1 contains first-place ties; refusing migration',rows);process.exit(1);}
          console.log('Performance D1 first-place tie guard passed');
          NODE

      - name: Apply migrations to Performance D1
        run: npx wrangler d1 migrations apply mahjong-score-performance --remote --config wrangler.performance.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Performance D1 backfill and row preservation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "SELECT (SELECT COUNT(*) FROM sessions) AS totalSessions,(SELECT COUNT(*) FROM games) AS totalGames,(SELECT COUNT(*) FROM game_results) AS totalResults,(SELECT COALESCE(SUM(score_point),0) FROM game_results) AS totalScore,(SELECT COUNT(*) FROM sessions WHERE group_id='perf-realistic-5y') AS baseSessions,(SELECT COUNT(*) FROM games g JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS baseGames,(SELECT COUNT(*) FROM game_results r JOIN games g ON g.id=r.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS baseResults,(SELECT COUNT(*) FROM game_results WHERE placement IS NULL) AS nullPlacements,(SELECT COUNT(*) FROM (SELECT game_id FROM game_results GROUP BY game_id HAVING SUM(CASE WHEN placement=1 THEN 1 ELSE 0 END)<>1)) AS badFirsts,(SELECT COUNT(*) FROM (SELECT game_id FROM game_results GROUP BY game_id HAVING SUM(CASE WHEN is_last=1 THEN 1 ELSE 0 END)<1)) AS badLasts;" > /tmp/performance-after.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=(path)=>{const data=JSON.parse(fs.readFileSync(path,'utf8'));return (Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0]??{};};
          const before=rows('/tmp/performance-before.json'),after=rows('/tmp/performance-after.json');
          for(const key of ['totalSessions','totalGames','totalResults','totalScore','baseSessions','baseGames','baseResults']){
            if(Number(before[key])!==Number(after[key])){console.error('Performance D1 row/score invariant changed',key,before,after);process.exit(1);}
          }
          for(const key of ['nullPlacements','badFirsts','badLasts']){
            if(Number(after[key])!==0){console.error('Performance D1 placement invariant failed',key,after);process.exit(1);}
          }
          console.log('Performance D1 placement migration/backfill verified', {before,after});
          NODE
