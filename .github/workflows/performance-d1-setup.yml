name: Performance D1 setup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SETUP-PERFORMANCE-D1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-performance-d1:
    if: ${{ inputs.confirmation == 'SETUP-PERFORMANCE-D1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: performance

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard migration safety
        run: npm run db:migrations:guard

      - name: Guard Performance D1 target
        shell: bash
        run: |
          set -eu
          grep -q '"database_name": "mahjong-score-performance"' wrangler.performance.jsonc
          grep -q '"database_id": "37b05ca8-9f6e-46b4-92be-7e02513cf044"' wrangler.performance.jsonc
          ! grep -q 'mahjong-score-prod' wrangler.performance.jsonc
          ! grep -q 'mahjong-score-preview' wrangler.performance.jsonc

      - name: Verify 5-year base fixture before migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "SELECT (SELECT COUNT(*) FROM sessions WHERE group_id='perf-realistic-5y') AS sessions,(SELECT COUNT(*) FROM games g JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS games,(SELECT COUNT(*) FROM game_results r JOIN games g ON g.id=r.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS results;" > /tmp/performance-before.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/performance-before.json','utf8'));
          const row=(Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0];
          if(!row||Number(row.sessions)!==260||Number(row.games)!==3120||Number(row.results)!==9360){
            console.error('Expected retained 5-year Performance fixture before migration', row);
            process.exit(1);
          }
          NODE

      - name: Apply migrations to Performance D1
        run: npx wrangler d1 migrations apply mahjong-score-performance --remote --config wrangler.performance.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Performance D1 backfill and row preservation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute mahjong-score-performance --remote --config wrangler.performance.jsonc --json --command "SELECT (SELECT COUNT(*) FROM sessions WHERE group_id='perf-realistic-5y') AS sessions,(SELECT COUNT(*) FROM games g JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS games,(SELECT COUNT(*) FROM game_results r JOIN games g ON g.id=r.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y') AS results,(SELECT COUNT(*) FROM game_results r JOIN games g ON g.id=r.game_id JOIN sessions s ON s.id=g.session_id WHERE s.group_id='perf-realistic-5y' AND r.placement IS NULL) AS nullPlacements,(SELECT COUNT(*) FROM (SELECT g.id FROM games g JOIN sessions s ON s.id=g.session_id JOIN game_results r ON r.game_id=g.id WHERE s.group_id='perf-realistic-5y' GROUP BY g.id HAVING SUM(CASE WHEN r.placement=1 THEN 1 ELSE 0 END)<>1)) AS badFirsts,(SELECT COUNT(*) FROM (SELECT g.id FROM games g JOIN sessions s ON s.id=g.session_id JOIN game_results r ON r.game_id=g.id WHERE s.group_id='perf-realistic-5y' GROUP BY g.id HAVING SUM(CASE WHEN r.is_last=1 THEN 1 ELSE 0 END)<1)) AS badLasts;" > /tmp/performance-after.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/performance-after.json','utf8'));
          const row=(Array.isArray(data)?data.flatMap(x=>x.results??[]):data.results??[])[0];
          const expected={sessions:260,games:3120,results:9360,nullPlacements:0,badFirsts:0,badLasts:0};
          for(const [key,value] of Object.entries(expected))if(Number(row?.[key])!==value){console.error('Performance migration verification failed',key,row);process.exit(1);}
          console.log('Performance D1 placement migration/backfill verified', row);
          NODE
