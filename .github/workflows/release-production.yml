name: Production Release (Manual + Approved)
run-name: Production release ${{ inputs.release_sha }}

# No push, pull_request, workflow_run, repository_dispatch or schedule trigger.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact current main commit SHA (40 lowercase hex)"
        type: string
        required: true
      approved_migrations:
        description: "Exact comma-separated migration files after Production baseline, or none"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mahjong-score-production-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify exact dispatch SHA and current main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          export MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          node scripts/production-release-gate.mjs context
      - name: Block duplicate SHA deployments and workflow reruns
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-production.yml/runs?event=workflow_dispatch&head_sha=$RELEASE_SHA&per_page=100" > /tmp/production-release-runs.json
          node scripts/production-release-gate.mjs duplicate /tmp/production-release-runs.json
      - name: Check exactly approved Migration file set
        env:
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
        run: node scripts/production-release-gate.mjs migrations
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Guard migration safety and CI-only release topology
        run: npm run db:migrations:guard
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Release negative-case tests
        run: node --test scripts/test-production-release-gate.mjs
      - name: Build
        run: npm run build
      - name: Verify generated Production D1 binding
        run: npm run db:binding:guard
      - name: Validate D1 migrations locally
        run: npm run db:migrate:local
      - name: Verify historical data migration regression
        run: npm run db:migrate:regression

  release:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Recheck pinned checkout, dispatch SHA and current main after approval
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export CHECKOUT_SHA="$(git rev-parse HEAD)"
          export MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          node scripts/production-release-gate.mjs context
      - name: Fail closed on missing Required reviewers or main-only Environment rule
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > /tmp/prod-environment.json
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > /tmp/prod-branch-policies.json
          node scripts/production-release-gate.mjs environment /tmp/prod-environment.json /tmp/prod-branch-policies.json
      - name: Recheck no earlier release attempt for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-production.yml/runs?event=workflow_dispatch&head_sha=$RELEASE_SHA&per_page=100" > /tmp/prod-runs-after-approval.json
          node scripts/production-release-gate.mjs duplicate /tmp/prod-runs-after-approval.json
      - name: Require separately provisioned Environment-only arming Secret
        env:
          PRODUCTION_RELEASE_ARMED: ${{ secrets.PRODUCTION_RELEASE_ARMED }}
        run: node scripts/production-release-gate.mjs arming
      - name: Check necessary Cloudflare credentials only after approval and guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies on pinned release SHA
        run: npm install --no-audit --no-fund
      - name: Revalidate source migration plan and generated binding
        env:
          APPROVED_MIGRATIONS: ${{ inputs.approved_migrations }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-release-gate.mjs migrations
          npm run db:migrations:guard
          npm run build
          npm run db:binding:guard
      # All remote operations start BELOW. No remote commands run without
      # the approved Environment, exact SHA, CI, and required rules.
      - name: Verify actual Production D1 UUID and name (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 info mahjong-score-prod --json > /tmp/production-d1-info.json
          node scripts/production-release-gate.mjs d1-info /tmp/production-d1-info.json
      - name: Record unapplied Production Migration list (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run db:migrations:list:prod
      - name: Capture and verify Production D1 recovery bookmark (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info DB --json > /tmp/production-d1-pre-migration.json
          node scripts/production-release-gate.mjs recovery /tmp/production-d1-pre-migration.json
      - name: Recheck main HEAD immediately before migration
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          node scripts/production-release-gate.mjs context
      - name: Apply only source-approved pending Production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:prod
      - name: Recheck pending Production migrations after apply (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrations:list:prod
      - name: Recheck main HEAD immediately before Worker deploy
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          node scripts/production-release-gate.mjs context
      - name: Deploy pinned build to Cloudflare Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify active Production Worker D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --name mahjong-score --json > /tmp/prod-deployment.json
          version_id="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/prod-deployment.json","utf8")); const versions=Array.isArray(d?.versions)?d.versions:[]; const active=versions.find(v=>Number(v.percentage)===100); if(!active?.version_id)process.exit(2); process.stdout.write(active.version_id)')"
          npx wrangler versions view "$version_id" --name mahjong-score --json > /tmp/production-worker-version.json
          npm run db:binding:verify-deployed
      - name: Verify deployed Production security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -fsSI --retry 5 --retry-delay 2 --retry-all-errors 'https://mahjong-score.ha-rookie.workers.dev/' | tr -d '\r')"
          grep -Eqi "^content-security-policy: .*frame-ancestors 'none'" <<< "$headers"
          grep -Eqi "^strict-transport-security: *max-age=31536000" <<< "$headers"
          grep -Eqi "^x-frame-options: *DENY" <<< "$headers"
          grep -Eqi "^x-content-type-options: nosniff" <<< "$headers"
          grep -Eqi "^referrer-policy: *strict-origin-when-cross-origin" <<< "$headers"
          grep -Eqi "^permissions-policy:" <<< "$headers"
