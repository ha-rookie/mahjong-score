name: S0 mobile HTTPS-readiness without remote deployment

on:
  pull_request:
    branches:
      - poc/issue-337-browser-webauthn
      - poc/issue-337-mobile-https-readiness
    paths:
      - 'poc/passkey/mobile/**'
      - '.github/workflows/s0-passkey-mobile-readiness.yml'

permissions:
  contents: read

jobs:
  isolated-browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install existing tools
        run: npm install --no-audit --no-fund
      - name: Install ephemeral Chromium tooling (no lockfile changes)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install local test Chromium
        run: npx playwright install --with-deps chromium
      - name: Bundle standalone Worker without cloud upload
        run: npx wrangler deploy --config poc/passkey/mobile/wrangler.jsonc --dry-run --outdir /tmp/s0-mobile-ready-build
      - name: Validate isolated config never binds production resources
        run: |
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("poc/passkey/mobile/wrangler.jsonc","utf8"));if(d.name==="mahjong-score"||d.d1_databases||d.kv_namespaces||d.r2_buckets||d.vars||d.assets||d.services||d.triggers||d.routes||d.route||d.workers_dev!==false||d.preview_urls!==false)process.exit(2);console.log("PASS no production resources bound")'
      - name: Local workerd with browser-native create/get and virtual authenticator
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config poc/passkey/mobile/wrangler.jsonc --local --ip 127.0.0.1 --port 8799 > /tmp/s0-mobile-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 60); do
            if curl --max-time 2 --silent --fail http://localhost:8799/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/s0-mobile-worker.log; exit 1; fi
          if ! node poc/passkey/mobile/ci-test.mjs > /tmp/s0-mobile-result.log 2>&1; then
            cat /tmp/s0-mobile-result.log
            cat /tmp/s0-mobile-worker.log
            exit 1
          fi
          cat /tmp/s0-mobile-result.log
          echo 'S0 MOBILE HTTPS READINESS LOCAL-ONLY PASS (no phone / no Cloudflare preview deployed)'
