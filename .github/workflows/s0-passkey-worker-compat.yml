name: S0 isolated WebAuthn workerd compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'poc/passkey/worker-compat/**'
      - '.github/workflows/s0-passkey-worker-compat.yml'

permissions:
  contents: read

jobs:
  local-workerd-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install existing project tools (CI-only)
        run: npm install --no-audit --no-fund
      - name: Install pinned SimpleWebAuthn (CI-only; no committed dependencies)
        run: npm install --no-save --no-package-lock --no-audit --no-fund @simplewebauthn/server@14.0.3
      - name: Build isolated Worker without publishing
        run: npx wrangler deploy --config poc/passkey/worker-compat/wrangler.jsonc --dry-run --outdir /tmp/passkey-s0-bundle
      - name: Apply the repo's current D1 migrations to fake local database only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --config poc/passkey/worker-compat/wrangler.jsonc --local --persist-to /tmp/passkey-s0-isolated-d1
          npx wrangler d1 migrations list DB --config poc/passkey/worker-compat/wrangler.jsonc --local --persist-to /tmp/passkey-s0-isolated-d1
      - name: Run isolated Workers runtime registration + authentication probe
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config poc/passkey/worker-compat/wrangler.jsonc --local --ip 127.0.0.1 --port 8799 --persist-to /tmp/passkey-s0-isolated-d1 > /tmp/passkey-s0.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 50); do
            if curl --max-time 2 --silent --fail http://127.0.0.1:8799/health > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/passkey-s0.log; exit 1; fi
          if ! curl --max-time 20 --silent --show-error --fail http://127.0.0.1:8799/probe > /tmp/passkey-s0-result.json; then
            cat /tmp/passkey-s0.log; cat /tmp/passkey-s0-result.json || true; exit 1
          fi
          cat /tmp/passkey-s0-result.json
          node -e 'const x=require("/tmp/passkey-s0-result.json"); if (!x.ok || Object.values(x.checks).some(v=>v!==true) || x.realCloudflareEdge!==false || x.realDevice!==false) process.exit(2)'
          echo 'S0 WEB AUTHN LOCAL WORKER PASS'
          if ! curl --max-time 25 --silent --show-error --fail http://127.0.0.1:8799/db-probe > /tmp/passkey-s0-d1-result.json; then
            cat /tmp/passkey-s0.log; cat /tmp/passkey-s0-d1-result.json || true; exit 1
          fi
          cat /tmp/passkey-s0-d1-result.json
          node -e 'const x=require("/tmp/passkey-s0-d1-result.json"); if (!x.ok || Object.keys(x.checks).length !== 10 || Object.values(x.checks).some(v=>v!==true) || x.realCloudflareD1!==false) process.exit(2)'
          echo 'S0 LOCAL WORKER + ISOLATED D1 FIXTURE PASS (not Production or actual browser)'
          if ! curl --max-time 25 --silent --show-error --fail http://127.0.0.1:8799/existing-schema-probe > /tmp/passkey-s0-existing-schema.json; then
            cat /tmp/passkey-s0.log; cat /tmp/passkey-s0-existing-schema.json || true; exit 1
          fi
          cat /tmp/passkey-s0-existing-schema.json
          node -e 'const x=require("/tmp/passkey-s0-existing-schema.json"); if (!x.ok || x.count !== 16 || Object.values(x.checks).some(v=>v!==true) || x.realProductionD1!==false || x.applicationHandlerCalled!==false) process.exit(2)'
          echo 'S0 EXISTING MAIN D1 SCHEMA AND LINE SQL SNAPSHOT PASS (local workerd only)'
          if ! curl --max-time 25 --silent --show-error --fail http://127.0.0.1:8799/actual-handler-probe > /tmp/passkey-s0-actual-handler.json; then
            cat /tmp/passkey-s0.log; cat /tmp/passkey-s0-actual-handler.json || true; exit 1
          fi
          cat /tmp/passkey-s0-actual-handler.json
          node -e 'const x=require("/tmp/passkey-s0-actual-handler.json"); if (!x.ok || x.count !== 18 || Object.values(x.checks).some(v=>v!==true) || x.actualApplicationHandlerCalled!==true || x.passkeyRegistrationImplemented!==false || x.realProductionD1!==false) process.exit(2)'
          echo 'S0 ACTUAL APP INVITATION HANDLER PASS (local workerd + existing D1 migration only)'
          if ! curl --max-time 30 --silent --show-error --fail http://127.0.0.1:8799/passkey-invite-probe > /tmp/passkey-s0-invite-passkey.json; then
            cat /tmp/passkey-s0.log; cat /tmp/passkey-s0-invite-passkey.json || true; exit 1
          fi
          cat /tmp/passkey-s0-invite-passkey.json
          node -e 'const x=require("/tmp/passkey-s0-invite-passkey.json"); if (!x.ok || x.count !== 15 || Object.values(x.checks).some(v=>v!==true) || x.verifiedRealLibraryFirst!==true || x.realAuthenticator!==false || x.realProductionD1!==false || x.usedExistingAppRedemptionFunction!==false || x.requiresNewAtomicDesign!==true) process.exit(2)'
          echo 'S0 PASSKEY VERIFICATION + ATOMIC INVITATION PROTOTYPE PASS (synthetic Workerd/local D1 only)'


