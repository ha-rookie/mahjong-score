name: Template validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check required files
        shell: bash
        run: |
          set -eu
          required=(
            AGENTS.md
            README.md
            CHANGELOG.md
            docs/README.md
            docs/00_PROJECT_OVERVIEW.md
            docs/01_REQUIREMENTS.md
            docs/02_SYSTEM_ARCHITECTURE.md
            docs/03_APPLICATION_ARCHITECTURE.md
            docs/04_REPOSITORY_STRUCTURE.md
            docs/05_DESIGN_MANAGEMENT.md
            docs/06_REQUIREMENTS_TRACEABILITY.md
            docs/design/README.md
            docs/design/index.html
            docs/design/_headers
            docs/design-public/index.html
            docs/design-public/_headers
            docs/DESIGN_PREVIEW.md
            docs/SECURITY_BASELINE.md
            docs/PUBLIC_WEB_QUALITY.md
            docs/workflow-templates/deploy-production.yml
            docs/workflow-templates/deploy-design-preview.yml
            docs/adr/README.md
            docs/adr/ADR-0000-template.md
            docs/GIT_WORKFLOW.md
            docs/ASSET_WORKFLOW.md
            docs/HUMAN_AI_COLLABORATION.md
            docs/CLOUDFLARE_SETUP.md
            docs/TROUBLESHOOTING.md
            docs/RELEASE_CHECKLIST.md
            .github/ISSUE_TEMPLATE/feature.yml
            .github/ISSUE_TEMPLATE/bug.yml
            .github/ISSUE_TEMPLATE/quick-change.yml
            .github/PULL_REQUEST_TEMPLATE.md
            .github/workflows/fork-monitor.yml
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty: $path"; exit 1; }
          done
      - name: Confirm template placeholders exist
        shell: bash
        run: |
          set -eu
          for path in             docs/00_PROJECT_OVERVIEW.md             docs/01_REQUIREMENTS.md             docs/02_SYSTEM_ARCHITECTURE.md             docs/03_APPLICATION_ARCHITECTURE.md             docs/04_REPOSITORY_STRUCTURE.md             docs/adr/ADR-0000-template.md
          do
            grep -q "CHANGE-ME" "$path" || {
              echo "Template file must retain CHANGE-ME placeholders: $path"
              exit 1
            }
          done
      - name: Confirm design management rules exist
        shell: bash
        run: |
          set -eu
          grep -q "承認済み最新設計: GitHub" docs/05_DESIGN_MANAGEMENT.md
          grep -q "Google Drive" docs/05_DESIGN_MANAGEMENT.md
          grep -q "Significant Design Change" docs/05_DESIGN_MANAGEMENT.md
          grep -q "Requirements Traceability" docs/05_DESIGN_MANAGEMENT.md
          grep -q "Design Previewは表示面" docs/design/README.md
          grep -q "Superseded" docs/adr/README.md
      - name: Confirm Replacement PR handoff fields exist
        shell: bash
        run: |
          set -eu
          grep -q "## Replacement PR" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "元PR:" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "引き継ぎhead SHA:" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "CI run:" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "Preview run:" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "引き継ぐ承認内容:" .github/PULL_REQUEST_TEMPLATE.md
      - name: Confirm Asset Handoff fields exist
        shell: bash
        run: |
          set -eu
          grep -q "label: Asset Handoff" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "元Design Issue/PR:" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "承認済みAsset一覧:" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "Asset配置場所:" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "file hash または承認head SHA:" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "## 実装Issueへの引き継ぎ" docs/ASSET_WORKFLOW.md
      - name: Confirm GitHub Actions resource rules exist
        shell: bash
        run: |
          set -eu
          grep -q "## GitHub Actions 実行資源" docs/GIT_WORKFLOW.md
          grep -q "同一原因を修正しないまま連続rerunしない" docs/GIT_WORKFLOW.md
          grep -q "## CI失敗" docs/TROUBLESHOOTING.md
          grep -q "failed jobだけ" docs/TROUBLESHOOTING.md

      - name: Confirm Asset lifecycle rules exist
        shell: bash
        run: |
          set -eu
          grep -q "## Assetの3分類" docs/ASSET_WORKFLOW.md
          grep -q "原本保存型" docs/ASSET_WORKFLOW.md
          grep -q "ビルド時生成型" docs/ASSET_WORKFLOW.md
          grep -q "同一Blob再利用型" docs/ASSET_WORKFLOW.md
          grep -q "## OGP" docs/ASSET_WORKFLOW.md
          grep -q "## favicon / App Icon / PWA Icon" docs/ASSET_WORKFLOW.md
          grep -q "Human Uploadを標準経路" docs/ASSET_WORKFLOW.md
          grep -q "GR-001 GitHub URL presentation" docs/HUMAN_AI_COLLABORATION.md
          grep -q "GR-002 Binary files use Human Upload by default" docs/HUMAN_AI_COLLABORATION.md
          grep -q "GR-003 Image generation requires explicit approval" docs/HUMAN_AI_COLLABORATION.md
          grep -q "GR-007 External capability / quota limitation" docs/HUMAN_AI_COLLABORATION.md
          grep -q "Human approval does not create a capability that the AI does not have" docs/HUMAN_AI_COLLABORATION.md
          grep -q "GR-008 Evidence-based work resumption / Recognition mismatch" docs/HUMAN_AI_COLLABORATION.md
          grep -q "External Capability / Quota" .github/PULL_REQUEST_TEMPLATE.md

      - name: Confirm consolidated pending standards exist
        shell: bash
        run: |
          set -eu
          grep -q "## AI変更制御" AGENTS.md
          grep -q "## 人間・AIのGitHub作業分担" AGENTS.md
          grep -q "## Change Contract / Pre-flight" docs/GIT_WORKFLOW.md
          grep -q "### CI失敗分類" docs/GIT_WORKFLOW.md
          grep -q "A: 今回の変更" docs/GIT_WORKFLOW.md
          grep -q "Implemented" docs/GIT_WORKFLOW.md
          grep -q "Actionsが起動しない・開始前に失敗する" docs/TROUBLESHOOTING.md
          grep -q "Asset変更前のPre-check" docs/ASSET_WORKFLOW.md
          grep -q "Production current spec" docs/ASSET_WORKFLOW.md
          grep -q "label: Planned Files" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "label: Risk Level" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "label: Impact Flags" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "label: Stop Conditions" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "label: Planned Files" .github/ISSUE_TEMPLATE/bug.yml
          grep -q "label: Impact Flags" .github/ISSUE_TEMPLATE/bug.yml
          grep -q "label: Goal" .github/ISSUE_TEMPLATE/quick-change.yml
          grep -q "Quick ChangeはLow Risk専用" .github/ISSUE_TEMPLATE/quick-change.yml
          grep -q "label: Impact Flags" .github/ISSUE_TEMPLATE/quick-change.yml
          grep -q "Human Gate" .github/ISSUE_TEMPLATE/quick-change.yml
          grep -q "## Risk / Impact Execution Profile" docs/GIT_WORKFLOW.md
          grep -q "Human Gateまで連続実行" docs/GIT_WORKFLOW.md
          grep -q "1 Issue = 1 coherent goal" docs/GIT_WORKFLOW.md
          grep -q "## 0.5 Risk / Impact 適用範囲" docs/RELEASE_CHECKLIST.md
          grep -q "## Execution Profile / Impact Flags" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "## Issue Contract / Scope Evidence" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "## Production Verified" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "人間によるbinary upload:" .github/ISSUE_TEMPLATE/feature.yml
          grep -q "SSL.org" docs/SECURITY_BASELINE.md
          grep -q "SSL.org" docs/RELEASE_CHECKLIST.md

      - name: Confirm Public Repository Gate standards exist
        shell: bash
        run: |
          set -eu
          grep -q "^  fork:$" .github/workflows/fork-monitor.yml
          grep -q "^  contents: read$" .github/workflows/fork-monitor.yml
          grep -q "^  issues: write$" .github/workflows/fork-monitor.yml
          grep -q "github.rest.issues.create" .github/workflows/fork-monitor.yml
          grep -q "## Public Repository Gate / Ruleset" docs/GIT_WORKFLOW.md
          grep -q "Ruleset `main protection`" docs/GIT_WORKFLOW.md
          grep -q "Template Repository自身をPublic化する場合も同じRuleset" docs/GIT_WORKFLOW.md
          grep -q "Public Repository Gate = Passed" docs/GIT_WORKFLOW.md
          grep -q "## 1.5 Public Repository Gate" docs/RELEASE_CHECKLIST.md
          grep -q "Block force pushes = ON" docs/RELEASE_CHECKLIST.md

      - name: Confirm Cloudflare v0.2 standards exist
        shell: bash
        run: |
          set -eu
          grep -q "GitHub Actions → Wrangler → Cloudflare Pages" docs/CLOUDFLARE_SETUP.md
          grep -q "Hello World Gate" docs/CLOUDFLARE_SETUP.md
          grep -q "Production Smoke" docs/CLOUDFLARE_SETUP.md
          grep -q "CHANGE-ME_PROJECT_NAME" docs/workflow-templates/deploy-production.yml

      - name: Confirm Security baseline exists
        shell: bash
        run: |
          set -eu
          grep -q "Content-Security-Policy" docs/SECURITY_BASELINE.md
          grep -q "Strict-Transport-Security" docs/SECURITY_BASELINE.md
          grep -q "X-Permitted-Cross-Domain-Policies" docs/SECURITY_BASELINE.md
          grep -q "Production Smoke" docs/SECURITY_BASELINE.md
          grep -q "外部診断" docs/SECURITY_BASELINE.md

      - name: Confirm Public Web Quality exists
        shell: bash
        run: |
          set -eu
          grep -q "Google Search Console" docs/PUBLIC_WEB_QUALITY.md
          grep -q "URLプレフィックス" docs/PUBLIC_WEB_QUALITY.md
          grep -q "HTMLファイル所有権確認" docs/PUBLIC_WEB_QUALITY.md
          grep -q "Previewは原則としてindexさせない" docs/PUBLIC_WEB_QUALITY.md
          grep -q "Public Trust" docs/PUBLIC_WEB_QUALITY.md

      - name: Confirm Design Preview foundation exists
        shell: bash
        run: |
          set -eu
          grep -q "noindex, nofollow" docs/design/_headers
          grep -q "noindex, nofollow" docs/design-public/_headers
          grep -q "pr-<PR番号>" docs/DESIGN_PREVIEW.md
          grep -q "main最新設計" docs/DESIGN_PREVIEW.md
          grep -q "manual-<run_id>" docs/DESIGN_PREVIEW.md
          grep -q "CHANGE-ME_DESIGN_PROJECT" docs/workflow-templates/deploy-design-preview.yml
          grep -q "Production用Functions / Workers / Bindings" docs/DESIGN_PREVIEW.md
