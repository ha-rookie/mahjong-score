name: Deploy Design Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/design/**"
      - ".github/workflows/deploy-design-preview.yml"
  push:
    branches:
      - main
    paths:
      - "docs/design/**"
      - ".github/workflows/deploy-design-preview.yml"

permissions:
  contents: read

concurrency:
  group: design-preview-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Resolve preview branch
        id: preview
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=latest" >> "$GITHUB_OUTPUT"
          else
            echo "branch=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Design Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx wrangler@CHANGE-ME_WRANGLER_VERSION pages deploy docs/design \
            --project-name=CHANGE-ME_DESIGN_PROJECT \
            --branch="${{ steps.preview.outputs.branch }}"
