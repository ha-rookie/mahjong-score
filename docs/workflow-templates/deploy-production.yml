name: Deploy Cloudflare Pages Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # CHANGE-ME: install / lint / test / build as required by the app.
      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Create Pages project if needed
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx wrangler@CHANGE-ME_WRANGLER_VERSION pages project create CHANGE-ME_PROJECT_NAME || true

      - name: Deploy Production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx wrangler@CHANGE-ME_WRANGLER_VERSION pages deploy CHANGE-ME_OUTPUT_DIR \
            --project-name=CHANGE-ME_PROJECT_NAME \
            --branch=main

      - name: Production smoke
        shell: bash
        run: |
          set -eu
          curl --fail --silent --show-error --location CHANGE-ME_PRODUCTION_URL > /tmp/production.html
          grep -q "CHANGE-ME_STABLE_MARKER" /tmp/production.html
          curl --fail --silent --show-error --head CHANGE-ME_PRODUCTION_URL
